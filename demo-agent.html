        return {
          set: function (label) {
            if (!noSize) sizeSlot(slot, measure, label, true);
            swapText(text, label, alsoDataText);
          },
          resync: function () { if (!noSize) sizeSlot(slot, measure, text.textContent, false); }
        };
      }

      /* ── 1 · Model picker ───────────────────────────────────────── */
      (function () {
        var trigger = document.getElementById("pickerTrigger");
        var menu = document.getElementById("pickerMenu");
        var body = document.getElementById("pickerBody");
        var shell = menu.parentElement;
        var pages = Array.prototype.slice.call(body.querySelectorAll(".t-page"));
        var modelSlot = makeSwapSlot("modelSlot", "modelMeasure", "modelText");
        var effortSlot = makeSwapSlot("effortSlot", "effortMeasure", "effortText");
        var effortHead = makeSwapSlot("effortHeadSlot", "effortHeadMeasure", "effortHeadText", false, true);
        var closeMs = cssNum("--dropdown-close-dur", 150);
        var open = false, timer = null;
        /* The pill is a summary, not a live readout: choices made
           inside the panel are held here and written to the pill
           only when the panel closes. */
        var pendingModel = "Fable 5.1", pendingEffort = "High";
        function commitToPill() {
          modelSlot.set(pendingModel);
          effortSlot.set(pendingEffort);
        }

        /* Card resize (01): body height follows the active page */
        function pageEl(id) { return pages.find(function (p) { return p.dataset.pageId === id; }); }
        function pageHeight(p) { return p.offsetHeight || p.scrollHeight; }
        function sizeBody(animate, id) {
          var next = pageHeight(pageEl(id || body.getAttribute("data-page")));
          if (!animate) {
            var prev = body.style.transition;
            body.style.transition = "none";
            body.style.height = next + "px";
            void body.offsetHeight;
            body.style.transition = prev;
          } else {
            body.style.height = next + "px";
          }
        }
        function goPage(id) {
          body.setAttribute("data-page", id);
          sizeBody(true, id);
        }

        /* Menu dropdown (05), pinned open: the menu is shown in place
           and never closes. It opens once on load with the transition
           suppressed so the first paint is at rest, and the pill commits
           the pending choices when the pointer leaves the panel. */
        function openDD() {
          if (open) return;
          open = true;
          body.setAttribute("data-page", "1");
          sizeBody(false, "1");
          var prev = menu.style.transition;
          menu.style.transition = "none";
          menu.classList.add("is-open");
          void menu.offsetWidth;
          menu.style.transition = prev;
          trigger.setAttribute("aria-expanded", "true");
          /* Reserve the tallest page in flow so the card resize never
             moves the prototypes below the picker. */
          var chrome = menu.offsetHeight - body.offsetHeight;
          shell.style.height = (Math.max.apply(null, pages.map(pageHeight)) + chrome) + "px";
        }
        void closeMs; void timer;
        trigger.addEventListener("click", function (e) { e.stopPropagation(); });
        menu.addEventListener("pointerleave", commitToPill);
        requestAnimationFrame(openDD);

        /* Model rows: move the check; the pill catches up on close */
        var rows = Array.prototype.slice.call(menu.querySelectorAll("[data-model]"));
        rows.forEach(function (row) {
          row.addEventListener("click", function () {
            rows.forEach(function (r) { r.setAttribute("aria-checked", String(r === row)); });
            pendingModel = row.dataset.model;
          });
        });

        /* Effort page (08) */
        document.getElementById("effortRow").addEventListener("click", function () { goPage("2"); });
        document.getElementById("effortBack").addEventListener("click", function () { goPage("1"); });

        /* Slider: 4 stops, header label swaps (04) live; pill on close */
        var LEVELS = ["Low", "Medium", "High", "Extra high"];
        var range = document.getElementById("effortRange");
        var thumb = document.getElementById("effortThumb");
        var track = range.parentElement;
        function placeThumb(animate) {
          var v = +range.value, max = +range.max;
          var travel = track.clientWidth - 3 - 3 - 16;   /* inset 3px both ends */
          var left = 3 + (travel * v) / max;
          if (!animate) {
            var prev = thumb.style.transition;
            thumb.style.transition = "none";
            thumb.style.left = left + "px";
            void thumb.offsetWidth;
            thumb.style.transition = prev;
          } else {
            thumb.style.left = left + "px";
          }
        }
        var lastLevel = +range.value;
        range.addEventListener("input", function () {
          placeThumb(true);
          var v = +range.value;
          if (v === lastLevel) return;
          lastLevel = v;
          effortHead.set(LEVELS[v]);
          pendingEffort = LEVELS[v];
        });
        requestAnimationFrame(function () { placeThumb(false); });
        window.addEventListener("resize", function () {
          placeThumb(false);
          modelSlot.resync(); effortSlot.resync(); effortHead.resync();
          if (open) sizeBody(false);
        });
      })();

      /* ── 2 · Image generation: thinking texts (15 + 04) ─────────── */
      (function () {
        var genSlot = makeSwapSlot("genSlot", "genMeasure", "genText", true, true);
        var STEPS = ["Generating image", "Thinking about composition", "Refining details", "Almost there"];
        var i = 0;
        setInterval(function () {
          i = (i + 1) % STEPS.length;
          genSlot.set(STEPS[i]);
        }, 2400);
      })();

      /* ── 3 · Publish: the card stands, its contents animate ─────── */
      (function () {
        var modal = document.getElementById("successModal");
        var btn = document.getElementById("publishBtn");
        var check = document.getElementById("successCheck");
        var checkPath = check.querySelector("path");
        var texts = document.getElementById("successTexts");
        var gapMs = cssNum("--request-gap", 50);
        var playTimer = null;

        /* Calibrate the draw to the real path length (recipe 10) */
        var checkLen = Math.ceil(checkPath.getTotalLength()) + 1;
        checkPath.style.strokeDasharray = String(checkLen);
        checkPath.style.strokeDashoffset = String(checkLen);

        function playCheck() {
          check.setAttribute("data-state", "out");
          checkPath.style.strokeDashoffset = String(checkLen);
          void check.offsetWidth;
          check.setAttribute("data-state", "in");
        }
        function showTexts() {
          texts.classList.remove("is-hiding");
          texts.classList.remove("is-shown");
          void texts.offsetHeight;
          texts.classList.add("is-shown");
        }
        function hideTexts() {
          texts.classList.add("is-hiding");
          texts.classList.remove("is-shown");
          setTimeout(function () { texts.classList.remove("is-hiding"); }, 200);
        }

        var canvas = document.getElementById("confettiCanvas");
        function fadeCheckOut() {
          /* Freeze the current opacity, drop the keyframes, then ease
             to 0 so the badge leaves with the copy instead of snapping. */
          check.style.opacity = getComputedStyle(check).opacity;
          check.setAttribute("data-state", "out");
          void check.offsetWidth;
          check.style.transition = "opacity 200ms ease";
          check.style.opacity = "0";
        }
        function play() {
          /* First run: the card is already there, so the content starts
             after the 50ms beat alone. Replay: everything on the card,
             check, copy and pile, fades out over 200ms first, then the
             whole choreography restarts from the beat. */
          clearTimeout(playTimer);
          var wasShown = texts.classList.contains("is-shown");
          if (wasShown) {
            fadeCheckOut();
            hideTexts();
            canvas.style.opacity = "0";
          } else {
            check.setAttribute("data-state", "out");
          }
          playTimer = setTimeout(function () {
            if (confettiBurst.reset) confettiBurst.reset();
            canvas.style.opacity = "";
            check.style.transition = "";
            check.style.opacity = "";
            playCheck();
            showTexts();
            confettiBurst();
          }, gapMs + (wasShown ? 200 : 0));
        }
        btn.addEventListener("click", play);

        /* Confetti burst (Pro): stage = the modal, collider = the badge */
        var confettiBurst = (function initConfetti() {
          var stage = modal;
          var canvas = document.getElementById("confettiCanvas");
          /* The badge slot is the only solid: a pill the flakes slide off.
             Text is not physical. Measured once per burst, after the modal
             has landed so the rect is 1:1. */
          var badgeSlot = document.querySelector(".success-badge-slot");
          var colliders = [];
          /* Generic pane: no physics at all. Flakes drop straight through
             the card with no collider, no floor, no tumble. */
          var plain = document.body.dataset.style === "generic";
          if (window.matchMedia("(prefers-reduced-motion: reduce)").matches) return function () {};
          var ctx = canvas.getContext("2d");
          function readNum(name, fallback) {
            var raw = getComputedStyle(stage).getPropertyValue(name).trim();
            if (!raw) return fallback;
            if (raw.endsWith("ms")) return parseFloat(raw);
            if (raw.endsWith("s") && !raw.endsWith("ms")) return parseFloat(raw) * 1000;
            var n = parseFloat(raw);
            return isNaN(n) ? fallback : n;
          }
          var COLORS = ["#ff4d67", "#ffb020", "#3b82f6", "#22c55e", "#a855f7", "#f97316", "#06b6d4", "#f43f5e"];
          var particles = [], running = false, lastT = 0, burstEnd = 0, fadeStart = null, stageW = 0, stageH = 0;
          function sizeCanvas() {
            var r = stage.getBoundingClientRect();
            var dpr = window.devicePixelRatio || 1;
            /* The stage is mid-scale while opening; measure the unscaled box. */
            stageW = stage.offsetWidth; stageH = stage.offsetHeight;
            canvas.width = Math.round(stageW * dpr);
            canvas.height = Math.round(stageH * dpr);
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
            void r;
          }
          function measureColliders() {
            var sr = stage.getBoundingClientRect();
            var list = [];
            var b = badgeSlot.getBoundingClientRect();
            list.push({ pill: true, left: b.left - sr.left, top: b.top - sr.top, right: b.right - sr.left, bottom: b.bottom - sr.top });
            return list;
          }
          function buttonSurface(x, b) {
            if (x < b.left || x > b.right) return null;
            if (!b.pill) return { y: b.top, slope: 0 };
            var r = (b.bottom - b.top) / 2;
            var lc = b.left + r, rc = b.right - r;
            if (x >= lc && x <= rc) return { y: b.top, slope: 0 };
            var cx = x < lc ? lc : rc;
            var dx = x - cx;
            var root = Math.sqrt(Math.max(r * r - dx * dx, 0));
            return { y: b.top + (r - root), slope: dx / Math.max(root, 0.001) };
          }
          function burst() {
            sizeCanvas();
            colliders = plain ? [] : measureColliders();
            var now = performance.now();
            var count = Math.round(readNum("--confetti-count", 120));
            var size = readNum("--confetti-size", 8);
            var spawnWindow = 500;
            particles = []; fadeStart = null;
            for (var i = 0; i < count; i++) {
              particles.push({
                start: now + Math.random() * spawnWindow,
                x: Math.random() * stageW, y: -12 - Math.random() * 30, py: -12,
                vx: (Math.random() - 0.5) * 60, vy: 40 + Math.random() * 120,
                w: size * (0.7 + Math.random() * 0.6), h: size * (0.5 + Math.random() * 0.5),
                maxFall: 420 + Math.random() * 280,
                rot: plain ? 0 : Math.random() * Math.PI, vr: plain ? 0 : (Math.random() - 0.5) * 7,
                tumble: Math.random() * Math.PI * 2, tumbleSpeed: plain ? 0 : 4 + Math.random() * 8, squish: 1,
                phase: Math.random() * Math.PI * 2, swayFreq: 2 + Math.random() * 3, swayScale: 0.5 + Math.random(),
                color: COLORS[Math.floor(Math.random() * COLORS.length)],
                bounces: 0, resting: false, dead: false
              });
            }
            burstEnd = now + spawnWindow + 100;
            if (!running) { running = true; lastT = now; requestAnimationFrame(frame); }
          }
          function step(dt, now) {
            var g = readNum("--confetti-gravity", 1300);
            var sway = readNum("--confetti-sway", 16);
            var restitution = readNum("--confetti-bounce", 0.3);
            for (var k = 0; k < particles.length; k++) {
              var p = particles[k];
              if (p.resting || p.dead || now < p.start) continue;
              p.py = p.y;
              p.vy += g * dt; if (p.vy > p.maxFall) p.vy = p.maxFall;
              p.phase += p.swayFreq * dt;
              p.x += (p.vx + Math.cos(p.phase) * sway * p.swayScale) * dt;
              p.y += p.vy * dt;
              p.rot += p.vr * dt;
              p.tumble += p.tumbleSpeed * dt;
              p.squish = plain ? 1 : 0.25 + 0.75 * Math.abs(Math.cos(p.tumble));
              var half = p.h / 2;
              if (p.vy > 0) {
                var b = null, s = null;
                for (var c = 0; c < colliders.length; c++) {
                  var sc = buttonSurface(p.x, colliders[c]);
                  if (sc && p.y + half >= sc.y && p.py + half <= sc.y + 2) { b = colliders[c]; s = sc; break; }
                }
                if (s) {
                  if (Math.abs(s.slope) > 0.85) {
                    var dir = p.x < (b.left + b.right) / 2 ? -1 : 1;
                    p.vx = dir * Math.max(Math.abs(p.vx), 50 + Math.random() * 50);
                    p.vy *= 0.35; p.y = s.y - half;
                  } else if (p.vy > 150 && p.bounces < 2) {
                    p.bounces++;
                    p.vy = -p.vy * restitution * (0.6 + Math.random() * 0.5);
                    p.vx = p.vx * 0.7 + s.slope * 40 + (Math.random() - 0.5) * 40;
                    p.y = s.y - half;
                  } else {
                    p.resting = true; p.y = s.y - half - 0.5; p.vx = 0; p.vy = 0;
                  }
                }
              }
              if (!plain && !p.resting && p.y + half >= stageH - 1) {
                if (p.vy > 170 && p.bounces < 2) {
                  p.bounces++;
                  p.vy = -p.vy * restitution * (0.5 + Math.random() * 0.4);
                  p.vx *= 0.7; p.y = stageH - 1 - half;
                } else {
                  p.resting = true; p.y = stageH - 1 - half; p.vx = 0; p.vy = 0;
                }
              }
              if (p.x < -30 || p.x > stageW + 30 || p.y > stageH + 30) p.dead = true;
            }
          }
          function draw(alpha) {
            ctx.clearRect(0, 0, stageW, stageH);
            ctx.globalAlpha = alpha;
            var now = performance.now();
            for (var k = 0; k < particles.length; k++) {
              var p = particles[k];
              if (p.dead || now < p.start) continue;
              ctx.save();
              ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, p.squish);
              ctx.fillStyle = p.color;
              ctx.fillRect(-p.w / 2, -p.h / 2, p.w, p.h);
              ctx.restore();
            }
            ctx.globalAlpha = 1;
          }
          function frame(now) {
            if (!running) return;
            var remaining = Math.min((now - lastT) / 1000, 0.25);
            lastT = now;
            while (remaining > 0) { var dt = Math.min(remaining, 1 / 60); step(dt, now); remaining -= dt; }
            var settled = now > burstEnd && particles.every(function (p) { return p.resting || p.dead; });
            if (settled && fadeStart === null) fadeStart = now + readNum("--confetti-hold", 1600);
            var alpha = 1;
            if (fadeStart !== null && now >= fadeStart) {
              var fade = Math.max(readNum("--confetti-fade", 600), 1);
              alpha = 1 - (now - fadeStart) / fade;
              if (alpha <= 0) { running = false; particles = []; ctx.clearRect(0, 0, stageW, stageH); return; }
            }
            draw(alpha);
            requestAnimationFrame(frame);
          }
          function reset() {
            running = false;
            particles = [];
            fadeStart = null;
            ctx.clearRect(0, 0, canvas.width, canvas.height);
          }
          window.addEventListener("resize", function () { if (running) sizeCanvas(); });
          burst.reset = reset;
          return burst;
        })();
      })();

      /* ── 4 · Email: error state shake (12) ──────────────────────── */
      (function () {
        var wrap = document.getElementById("emailForm");
        var input = document.getElementById("emailInput");
        function ms(name, fb) {
          var v = parseFloat(getComputedStyle(input).getPropertyValue(name));
          return Number.isFinite(v) ? v : fb;
        }
        function showError() {
          wrap.classList.add("is-error");
          input.classList.add("is-error");
          input.classList.remove("is-shaking");
          void input.offsetWidth;
          input.classList.add("is-shaking");
          var shakeMs = ms("--shake-dur-a", 80) * 2 + ms("--shake-dur-b", 60) * 2;
          setTimeout(function () { input.classList.remove("is-shaking"); }, shakeMs + 20);
          if (wrap._revertTimer) clearTimeout(wrap._revertTimer);
          var hold = ms("--revert-hold", 3000);
          wrap._revertTimer = setTimeout(function () {
            wrap._revertTimer = null;
            wrap.classList.remove("is-error");
            input.classList.remove("is-error");
          }, shakeMs + hold);
        }
        wrap.addEventListener("submit", function (e) {
          e.preventDefault();
          var v = input.value.trim();
          var ok = /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
          if (!ok) showError();
        });
        input.addEventListener("input", function () {
          if (wrap._revertTimer) { clearTimeout(wrap._revertTimer); wrap._revertTimer = null; }
          wrap.classList.remove("is-error");
          input.classList.remove("is-error");
        });
      })();

      /* ── Dev panel: writes --organic-* on :root, persists locally ── */
      (function () {
        var root = document.documentElement;
        var body = document.getElementById("devpanelBody");
        var panel = document.getElementById("devpanel");
        var toggle = document.getElementById("devpanelToggle");
        var STORE = "tdev:organic-dev";

        var COLORS = [
          ["--organic-blue", "Blue"], ["--organic-pink", "Pink"], ["--organic-green", "Green"],
          ["--organic-purple", "Purple"], ["--organic-orange", "Orange"], ["--organic-teal", "Teal"],
          ["--organic-violet", "Violet"], ["--organic-magenta", "Magenta"]
        ];
        var RANGES = [
          ["--organic-dur", "Sweep", 1000, 6000, 100, "ms"],
          ["--organic-band-span", "Band", 10, 50, 1, "%"],
          ["--organic-opacity", "Band alpha", 0, 1, 0.05, ""],
          ["--organic-glow-blur", "Glow blur", 0, 40, 1, "px"],
          ["--organic-glow-strength", "Glow", 0, 1, 0.05, ""],
          ["--organic-ring-strength", "Ring", 0, 1, 0.05, ""]
        ];
        var EFFECT = [
          ["--organic-saturation", "Saturation", 0, 3, 0.05, ""],
          ["--organic-shimmer-opacity", "Opacity", 0, 1, 0.05, ""],
          ["--organic-tile-alpha", "Tile alpha", 0, 1, 0.05, ""]
        ];
        var ALL = COLORS.concat(RANGES, EFFECT);
        var defaults = {};
        function readVar(name) { return getComputedStyle(root).getPropertyValue(name).trim(); }
        function tripletToHex(t) {
          var p = t.split(",").map(function (n) { return parseInt(n, 10); });
          return "#" + p.map(function (n) { return ("0" + n.toString(16)).slice(-2); }).join("");
        }
        function hexToTriplet(h) {
          return [1, 3, 5].map(function (i) { return parseInt(h.slice(i, i + 2), 16); }).join(", ");
        }
        var saved = {};
        try { saved = JSON.parse(localStorage.getItem(STORE) || "{}"); } catch (_) {}
        function persist() {
          var out = {};
          ALL.forEach(function (d) {
            var v = root.style.getPropertyValue(d[0]);
            if (v) out[d[0]] = v;
          });
          try { localStorage.setItem(STORE, JSON.stringify(out)); } catch (_) {}
        }
        function group(label) {
          var g = document.createElement("div");
          g.className = "devpanel-group";
          g.textContent = label;
          body.appendChild(g);
        }
        function row(labelText, input, out) {
          var r = document.createElement("div");
          r.className = "devrow";
          var l = document.createElement("label");
          l.textContent = labelText;
          r.appendChild(l); r.appendChild(input);
          var o = document.createElement("output");
          o.textContent = out || "";
          r.appendChild(o);
          body.appendChild(r);
          return o;
        }

        /* Presets: eight triplets in COLORS order (blue, pink, green,
           purple, orange, teal, violet, magenta). */
        var PRESETS = {
          "Default": null,   /* the recipe palette from :root */
          "Blue":    ["40, 140, 255", "80, 170, 255", "30, 200, 230", "90, 110, 255", "120, 190, 255", "30, 185, 220", "60, 90, 255", "100, 150, 255"],
          "Purple":  ["150, 80, 255", "200, 60, 220", "170, 110, 255", "180, 40, 240", "220, 90, 255", "130, 60, 230", "100, 70, 255", "240, 50, 180"],
          "Mono":    ["60, 60, 70", "40, 40, 50", "80, 80, 90", "30, 30, 40", "70, 70, 80", "50, 50, 60", "30, 30, 40", "40, 40, 50"]
        };
        var colorCtl = {};
        var presetBtns = [];
        function markPreset(label) {
          presetBtns.forEach(function (b) { b.setAttribute("aria-pressed", String(b.textContent === label)); });
        }
        function applyPreset(label) {
          var vals = PRESETS[label];
          COLORS.forEach(function (d, i) {
            var name = d[0];
            var triplet = vals ? vals[i] : defaults[name];
            if (vals) root.style.setProperty(name, triplet);
            else root.style.removeProperty(name);
            var ctl = colorCtl[name];
            ctl.input.value = tripletToHex(triplet);
            ctl.out.textContent = ctl.input.value;
          });
          markPreset(label);
          persist();
        }

        group("Presets");
        var presetRow = document.createElement("div");
        presetRow.className = "devpanel-presets";
        Object.keys(PRESETS).forEach(function (label) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "pill"; b.textContent = label;
          b.setAttribute("aria-pressed", "false");
          b.addEventListener("click", function () { applyPreset(label); });
          presetRow.appendChild(b);
          presetBtns.push(b);
        });
        body.appendChild(presetRow);

        group("Colours");
        COLORS.forEach(function (d) {
          var name = d[0];
          defaults[name] = readVar(name);
          if (saved[name]) root.style.setProperty(name, saved[name]);
          var input = document.createElement("input");
          input.type = "color";
          input.value = tripletToHex(readVar(name));
          var out = row(d[1], input, input.value);
          colorCtl[name] = { input: input, out: out };
          input.addEventListener("input", function () {
            root.style.setProperty(name, hexToTriplet(input.value));
            out.textContent = input.value;
            markPreset(null);   /* a manual tweak is no longer a preset */
            persist();
          });
        });
        /* Light up the matching preset on load, if any */
        (function () {
          var current = COLORS.map(function (d) { return readVar(d[0]); }).join("|");
          var hit = null;
          if (COLORS.map(function (d) { return defaults[d[0]]; }).join("|") === current) hit = "Default";
          else Object.keys(PRESETS).forEach(function (label) {
            if (PRESETS[label] && PRESETS[label].join("|") === current) hit = label;
          });
          markPreset(hit);
        })();

        function rangeRows(list) {
          list.forEach(function (d) {
            var name = d[0], unit = d[5];
            defaults[name] = readVar(name);
            if (saved[name]) root.style.setProperty(name, saved[name]);
            var input = document.createElement("input");
            input.type = "range"; input.min = d[2]; input.max = d[3]; input.step = d[4];
            input.value = parseFloat(readVar(name));
            var out = row(d[1], input, input.value + unit);
            input.addEventListener("input", function () {
              root.style.setProperty(name, input.value + unit);
              out.textContent = input.value + unit;
              persist();
            });
          });
        }
        group("Effect");
        rangeRows(EFFECT);
        group("Beam");
        rangeRows(RANGES);

        var actions = document.createElement("div");
        actions.className = "devpanel-actions";
        var copy = document.createElement("button");
        copy.type = "button"; copy.className = "pill"; copy.textContent = "Copy CSS";
        var reset = document.createElement("button");
        reset.type = "button"; reset.className = "pill"; reset.textContent = "Reset";
        actions.appendChild(copy); actions.appendChild(reset);
        body.appendChild(actions);

        copy.addEventListener("click", function () {
          var lines = ALL.map(function (d) {
            return "  " + d[0] + ": " + readVar(d[0]) + ";";
          });
          var css = ":root {\n" + lines.join("\n") + "\n}";
          try { navigator.clipboard.writeText(css); } catch (_) {}
          copy.textContent = "Copied";
          setTimeout(function () { copy.textContent = "Copy CSS"; }, 1200);
        });
        reset.addEventListener("click", function () {
          ALL.forEach(function (d) { root.style.removeProperty(d[0]); });
          try { localStorage.removeItem(STORE); } catch (_) {}
          body.textContent = "";
          location.reload();
        });
        toggle.addEventListener("click", function () {
          var isOpen = panel.getAttribute("data-open") === "true";
          panel.setAttribute("data-open", String(!isOpen));
          toggle.setAttribute("aria-expanded", String(!isOpen));
        });
      })();

      /* ── 6 · Toast stacking (homepage P34) on the Figma toast ────── */
      (function () {
        var stack = document.getElementById("toastStack");
        var stage = document.getElementById("toastStage");
        var closeMs = cssNum("--stack-close", 250);
        var toasts = [];   /* newest first */

        var MESSAGES = ["Message sent", "Changes saved", "Link copied"];
        /* Seeds show 0/1/2 top to bottom, so the first add continues the
           rotation instead of repeating the toast already on top. */
        var msgIndex = 1;
        function toastMarkup(text) {
          return '<span class="toast-check" aria-hidden="true">'
            + '<svg viewBox="0 0 16 16" width="16" height="16" fill="none"><path d="M4.5 8.4L7 10.9L11.5 5.6" stroke="#3aa93a" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
            + '</span>'
            + '<span class="toast-text">' + text + '</span>'
            + '<button class="toast-close" type="button" aria-label="Dismiss">'
            + '<svg viewBox="0 0 10 10" width="10" height="10" fill="none"><path d="M2.5 2.5L7.5 7.5M7.5 2.5L2.5 7.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>'
            + '</button>';
        }
        function relayer() {
          toasts.forEach(function (t, i) {
            if (i > 2) { leave(t); return; }
            t.setAttribute("data-depth", String(i));
          });
          toasts = toasts.slice(0, 3);
        }
        function leave(t) {
          if (t.classList.contains("is-leaving")) return;
          t.classList.add("is-leaving");
          setTimeout(function () { if (t.parentNode) t.parentNode.removeChild(t); }, closeMs + 60);
        }
        function make(depth, enter, text) {
          var el = document.createElement("div");
          el.className = "t-stack-toast" + (enter ? " is-enter" : "");
          el.setAttribute("data-depth", String(depth));
          el.setAttribute("role", "status");
          el.innerHTML = toastMarkup(text);
          el.querySelector(".toast-close").addEventListener("click", function (e) {
            e.stopPropagation();
            var i = toasts.indexOf(el);
            if (i > -1) toasts.splice(i, 1);
            leave(el);
            relayer();
          });
          return el;
        }
        function add() {
          var el = make(0, true, MESSAGES[msgIndex++ % MESSAGES.length]);
          toasts.unshift(el);
          stack.appendChild(el);
          relayer();
          /* Flush the pre-open rest state, then release it in the same
             task: a rAF hop is skipped whenever the frame clock is
             throttled and the toast would land with no motion. */
          void el.offsetWidth;
          el.classList.remove("is-enter");
        }
        /* Seed three at rest so the stack reads at a glance */
        for (var d = 2; d >= 0; d--) {
          var seed = make(d, false, MESSAGES[d]);
          stack.appendChild(seed);
          toasts.unshift(seed);
        }
        stage.addEventListener("click", add);
        stage.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); add(); }
        });

        /* Spread from pointer geometry, not :hover: the gaps between
           spread toasts belong to no element. */
        function spreadHeight() { return (stack.offsetHeight + cssNum("--stack-spread-gap", 8)) * 2; }
        function within(e, above) {
          var r = stack.getBoundingClientRect();
          return e.clientX >= r.left && e.clientX <= r.right && e.clientY <= r.bottom && e.clientY >= r.top - above;
        }
        document.addEventListener("pointermove", function (e) {
          if (stack.classList.contains("is-spread")) {
            if (!within(e, spreadHeight())) stack.classList.remove("is-spread");
          } else if (within(e, 0)) {
            stack.classList.add("is-spread");
          }
        });
        document.documentElement.addEventListener("pointerleave", function () { stack.classList.remove("is-spread"); });
      })();

      /* ── 7 · Toggle (27) ─────────────────────────────────────────── */
      (function () {
        var toggle = document.getElementById("toggle1");
        toggle.addEventListener("click", function () {
          /* .is-init on first interaction so the off keyframes don't
             play once at page load. */
          toggle.classList.add("is-init");
          var on = toggle.getAttribute("data-on") === "true";
          toggle.setAttribute("data-on", String(!on));
          toggle.setAttribute("aria-checked", String(!on));
        });
      })();

      /* ── 8 · Notification badge (03) ─────────────────────────────── */
      (function () {
        var bell = document.getElementById("bell");
        var badge = document.getElementById("bellBadge");
        bell.addEventListener("click", function () {
          var open = badge.getAttribute("data-open") === "true";
          badge.setAttribute("data-open", String(!open));
          bell.setAttribute("aria-pressed", String(!open));
        });
      })();

      /* ── 5 · Team: avatar group hover (11) ───────────────────────── */
      (function () {
        var root = document.querySelector(".t-avatar-group");
        var avatars = Array.prototype.slice.call(root.querySelectorAll(".t-avatar"));
        function setShifts(activeIdx, phase) {
          var gs = getComputedStyle(root);
          var num = function (n, fb) { var v = parseFloat(gs.getPropertyValue(n)); return Number.isFinite(v) ? v : fb; };
          var lift = num("--avatar-lift", -4);
          var falloff = num("--avatar-falloff", 0.45);
          var scale = num("--avatar-scale", 1.05);
          var tf = phase === "out"
            ? gs.getPropertyValue("--avatar-ease-out").trim() || "cubic-bezier(0.34, 3.85, 0.64, 1)"
            : gs.getPropertyValue("--avatar-ease-in").trim() || "cubic-bezier(0.22, 1, 0.36, 1)";
          avatars.forEach(function (el, i) {
            el.style.transitionTimingFunction = tf;
            if (activeIdx == null) {
              el.style.setProperty("--shift", "0px");
              el.style.setProperty("--scale-active", "1");
              return;
            }
            var d = Math.abs(i - activeIdx);
            el.style.setProperty("--shift", (lift * Math.pow(falloff, d)).toFixed(3) + "px");
            el.style.setProperty("--scale-active", i === activeIdx ? String(scale) : "1");
          });
        }
        avatars.forEach(function (el, i) { el.addEventListener("mouseenter", function () { setShifts(i, "in"); }); });
        root.addEventListener("mouseleave", function () { setShifts(null, "out"); });

        var canHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
        if (!canHover) return;
        var tip = document.createElement("span");
        tip.className = "avatar-tooltip";
        tip.setAttribute("role", "tooltip");
        tip.setAttribute("aria-hidden", "true");
        tip.setAttribute("data-show", "false");
        var tipText = document.createElement("span");
        tipText.className = "avatar-tooltip-text";
        tip.appendChild(tipText);
        root.appendChild(tip);
        var hideTimer = null;
        function cancelHide() { if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
        function hideSoon() {
          cancelHide();
          hideTimer = setTimeout(function () { tip.setAttribute("data-show", "false"); tip.setAttribute("aria-hidden", "true"); }, 50);
        }
        var plainTip = document.body.dataset.style === "generic";
        function place(wrap, text) {
          cancelHide();
          /* Generic: every avatar gets its own tooltip instance rather
             than one that travels. Drop the current one first, flush it,
             then build the next from scratch so the fade replays. */
          if (plainTip && tip.getAttribute("data-show") === "true") {
            /* Suppress the transition while tearing the old one down:
               without it the hide only starts a fade the show below
               would immediately reverse, and nothing reads as new. */
            tip.style.transition = "none";
            tip.setAttribute("data-show", "false");
            tip.setAttribute("aria-hidden", "true");
            void tip.offsetWidth;
            tip.style.transition = "";
          }
          tipText.textContent = text;
          var nextWidth = Math.ceil(tipText.scrollWidth + 24);
          var stackRect = root.getBoundingClientRect();
          var wrapRect = wrap.getBoundingClientRect();
          var center = (wrapRect.left - stackRect.left) + wrapRect.width / 2;
          var nextX = center - nextWidth / 2;
          var maxX = Math.max(0, stackRect.width - nextWidth);
          if (nextX < 0) nextX = 0;
          if (nextX > maxX) nextX = maxX;
          tip.style.width = nextWidth + "px";
          tip.style.transform = "translateX(" + nextX + "px)";
          tip.setAttribute("data-show", "true");
          tip.setAttribute("aria-hidden", "false");
        }
        avatars.forEach(function (el) { el.addEventListener("mouseenter", function () { place(el, el.getAttribute("data-name") || ""); }); });
        root.addEventListener("mouseenter", cancelHide);
        root.addEventListener("mouseleave", hideSoon);
      })();
    })();
  </script>
</body>
</html>
