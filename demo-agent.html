<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Demo - Agent workspace</title>
  <meta name="robots" content="noindex" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <style>
    /* ──────────────────────────────────────────────────────────────
       Agent workspace demo page (Figma Portfolio 1531:41866). Five
       prototypes, every motion from a transitions.dev recipe:
       1 model picker: menu dropdown (05) + page side-by-side (08) +
         card resize (01) + text states swap (04)
       2 image generation: organic shimmer (Pro, greyscale) +
         shimmer text (15) + text states swap (04)
       3 publish: modal (06) + success check (10) + confetti (Pro)
       4 email: error state shake (12)
       5 team: avatar group hover (11)
       ────────────────────────────────────────────────────────────── */
    :root {
      --bg-page: #ffffff;
      --bg-modal: #ffffff;
      --bg-tertiary: rgba(61, 61, 61, 0.04);
      --bg-ghost-hover: rgba(61, 61, 61, 0.04);
      --bg-backdrop: rgba(0, 0, 0, 0.12);

      --text-strong: #0f0f0f;
      --text-label: #1b1b1b;
      --text-dim: #9c9c9c;
      --text-muted: #737373;
      --text-on-dropdown: #17181c;

      --shadow-modal:
        0 0 0 1px rgba(0, 0, 0, 0.06),
        0 2px 6px 0 rgba(0, 0, 0, 0.05),
        0 4px 42px 0 rgba(0, 0, 0, 0.06);

      --radius-menu: 18px;
      --radius-row: 12px;
      --radius-pill: 50px;

      /* ── transitions.dev tunables (skill _root.css) ─────────── */
      /* Card resize (01) */
      --resize-dur: 300ms;
      --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Text states swap (04) */
      --text-swap-dur: 150ms;
      --text-swap-enter-delay: 0ms;
      --text-swap-translate-y: 4px;
      --text-swap-blur: 2px;
      --text-swap-ease: ease-in-out;
      /* Menu dropdown (05) */
      --dropdown-open-dur: 250ms;
      --dropdown-close-dur: 150ms;
      --dropdown-pre-scale: 0.97;
      --dropdown-closing-scale: 0.99;
      --dropdown-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Modal (06) */
      --modal-open-dur: 250ms;
      --modal-close-dur: 150ms;
      --modal-scale: 0.96;
      --modal-scale-close: 0.96;
      --modal-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Page side-by-side (08) */
      --page-slide-dur: 250ms;
      --page-fade-dur: 250ms;
      --page-slide-distance: 8px;
      --page-blur: 3px;
      --page-stagger: 0ms;
      --page-exit-enabled: 1;
      --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Success check (10) */
      --check-opacity-dur: 550ms;
      --check-rotate-dur: 550ms;
      --check-rotate-from: 80deg;
      --check-bob-dur: 450ms;
      --check-y-amount: 16.8px;
      --check-blur-dur: 500ms;
      --check-blur-from: 10px;
      --check-path-dur: 550ms;
      --check-path-delay: 80ms;
      --check-ease-out: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
      --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
      /* Beat between the modal landing and the success choreography
         starting, same as the Send-request state on demo-example-skill */
      --request-gap: 50ms;
      /* Texts reveal (18), tuned as on demo-example-skill.html */
      --stagger-dur: 500ms;
      --stagger-delay: 0ms;
      --stagger-distance: 8.4px;
      --stagger-stagger: 40ms;
      --stagger-blur: 3px;
      --stagger-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Toast stacking (homepage P34, sonner-style): a new toast rises
         with the toast motion (22), older ones step back a peek, a
         little smaller and dimmer; the fourth is pushed out. */
      --stack-open: 350ms;
      --stack-close: 250ms;
      --stack-distance: 60px;
      --stack-blur: 2px;
      --stack-scale-in: 0.97;
      --stack-peek: 12px;
      --stack-spread-gap: 8px;
      --stack-depth-scale: 0.06;
      --stack-depth-fade: 0.4;
      --stack-depth1-blur: 1px;   /* second toast in the stack */
      --stack-depth2-blur: 2px;   /* third */
      --stack-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Toggle (27), 40x20 as on demo-example-skill.html */
      --toggle-dur: 350ms;
      --toggle-travel: 13.34px;
      --toggle-ov1: 1px;
      --toggle-ov2: 0px;
      --toggle-track: 0ms;
      --toggle-ease: cubic-bezier(0.34, 1.35, 0.64, 1);
      --toggle-track-off: #e0e0e0;
      --toggle-track-on: #34c759;
      --toggle-thumb-bg: #ffffff;
      /* Notification badge (03) */
      --badge-slide-dur: 260ms;
      --badge-pop-dur: 500ms;
      --badge-pop-close-dur: 180ms;
      --badge-fade-dur: 400ms;
      --badge-fade-close-dur: 180ms;
      --badge-blur: 2px;
      --badge-offset-x: -8.2px;
      --badge-offset-y: 12.4px;
      --badge-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --badge-pop-ease: cubic-bezier(0.34, 1.36, 0.64, 1);
      --badge-close-ease: cubic-bezier(0.4, 0, 0.2, 1);
      /* Avatar group hover (11) */
      --avatar-lift: -4px;
      --avatar-dur: 320ms;
      --avatar-scale: 1.05;
      --avatar-falloff: 0.45;
      --avatar-ease-in: cubic-bezier(0.22, 1, 0.36, 1);
      --avatar-ease-out: cubic-bezier(0.34, 3.85, 0.64, 1);
      /* Error state shake (12) */
      --shake-distance: 6px;
      --shake-overshoot: 4px;
      --shake-dur-a: 80ms;
      --shake-dur-b: 60ms;
      --shake-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --revert-hold: 3000ms;
      --revert-dur: 280ms;
      /* Shimmer text (15) */
      --shimmer-dur: 2000ms;
      --shimmer-base: #7c7c7c;
      --shimmer-highlight: #0d0d0d;
      --shimmer-band: 400%;
      --shimmer-ease: linear;
      /* Organic shimmer (Pro), namespaced --organic-* here because
         the text recipe above already owns --shimmer-dur / -ease.
         Every colour is an RGB triplet so the recipe's per-blob alpha
         stays intact; the dev panel writes these on :root. */
      --organic-dur: 3000ms;
      --organic-ease: ease-out;
      --organic-band-span: 21%;
      --organic-opacity: 1;
      --organic-glow-blur: 20px;
      --organic-glow-strength: 0.5;
      --organic-ring-strength: 0.6;
      --organic-scale: 1.3;   /* 185 / 142 */
      --organic-saturation: 0.1;      /* saturate() on the whole effect */
      --organic-shimmer-opacity: 0.75;   /* band + beam together */
      --organic-tile-alpha: 1;        /* the grey placeholder itself */
      /* Tuned in the dev panel: a cool blue spread, desaturated to a
         near-mono wash with a soft beam. */
      --organic-blue:    40, 140, 255;
      --organic-pink:    80, 170, 255;
      --organic-green:   30, 200, 230;
      --organic-purple:  90, 110, 255;
      --organic-orange:  120, 190, 255;
      --organic-teal:    30, 185, 220;
      --organic-violet:  60, 90, 255;
      --organic-magenta: 100, 150, 255;
      /* Confetti burst (Pro) */
      --confetti-count: 90;
      --confetti-gravity: 1300;
      --confetti-size: 4.9px;   /* 7px, 30% smaller */
      --confetti-sway: 16;
      --confetti-bounce: 0.3;
      --confetti-hold: 1600ms;
      --confetti-fade: 600ms;
    }

    /* ── Base ─────────────────────────────────────────────────────── */
    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-text-size-adjust: 100%;
      font-feature-settings: "cv11", "ss01";
    }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg-page);
      color: var(--text-strong);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Helvetica, Arial, sans-serif;
      font-size: 14px;
      line-height: 22px;
    }
    button, input {
      font-family: inherit;
      -webkit-font-smoothing: inherit;
      -moz-osx-font-smoothing: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    /* ── Embed mode: the prototypes render only inside the iframes ─── */
    html[data-embed="true"] { background: transparent; overflow: visible; }
    /* The panes are painted #f6f6f6 by the parent; anything that cuts
       out of the page colour (the avatar rings) must match that. */
    body[data-embed="true"] { --bg-page: #f6f6f6; background: transparent; min-height: 0; width: 100%; overflow: visible; }
    .article { display: none; }
    body[data-embed="true"] .article { display: flex; }
    /* The dev panel lives in the skill iframe only: absolute at the
       top right (fixed would pin it to the bottom of a 1500px frame)
       and collapsed until wanted. The outer page has no shimmer of
       its own to tune, so it hides its copy. */
    body:not([data-embed="true"]) .devpanel { display: none; }
    body[data-embed="true"] .devpanel { position: absolute; top: 16px; right: 16px; bottom: auto; }
    body[data-style="generic"] .devpanel { display: none; }

    /* ── Standalone compare stage (same as demo-example-skill.html) ── */
    .compare-stage { display: none; }
    body:not([data-embed="true"]) .compare-stage {
      display: flex;
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
      padding: 64px 24px;
      gap: 24px;
      flex-direction: row;
      justify-content: center;
      align-items: stretch;
      flex-wrap: wrap;
    }
    .compare-pane {
      flex: 1 1 360px;
      min-width: 0;
      max-width: 540px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }
    .compare-pane-heading { display: inline-flex; align-items: center; gap: 6px; }
    .compare-pane-badge {
      width: 20px; height: 20px; border-radius: 20px; flex: 0 0 20px;
      display: inline-grid; place-items: center;
      box-shadow:
        0 1px 1px rgba(0, 0, 0, 0.1),
        0 1px 4px rgba(0, 0, 0, 0.08),
        inset 0 0 0 1px rgba(0, 0, 0, 0.05),
        inset 0 -1px 1px rgba(0, 0, 0, 0.09);
    }
    .compare-pane-badge--off { background: #f03434; }
    .compare-pane-badge--on  { background: #35ba00; }
    .compare-pane-badge svg { display: block; width: 10px; height: 10px; }
    .compare-pane-label { font-weight: 500; font-size: 14px; line-height: 14px; color: #232323; }
    .compare-pane-iframe {
      /* Sized to the embed's content (1363px) so the panes never scroll. */
      display: block; width: 100%; height: 1370px; border: 0; border-radius: 14px;
      background: #f6f6f6; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.04);
    }
    @media (max-width: 760px) {
      body:not([data-embed="true"]) .compare-stage { flex-direction: column; align-items: stretch; padding: 32px 16px; }
      .compare-pane { max-width: 100%; }
    }

    /* ── Article layout (same shell as article.html) ──────────────── */
    .article {
      max-width: 1005px;
      margin: 0 auto;
      padding: 48px 24px 64px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 32px;
    }
    .demo {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }
    /* The picker reserves its tallest page in flow, so it sits closer to
       the toast stack than the column's 32px gap suggests. */
    .demo--picker { margin-bottom: -32px; }

    /* ── Tertiary pill (Figma .Button/Small/Tertiary) ─────────────── */
    .pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 36px;
      padding: 0 16px;
      border: 0;
      border-radius: var(--radius-pill);
      background: var(--bg-tertiary);
      color: var(--text-label);
      font-size: 14px;
      line-height: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background-color 130ms ease, transform 130ms ease;
    }
    .pill:hover { background: rgba(61, 61, 61, 0.07); }
    .pill:active { transform: scale(0.97); }
    .pill--menu { padding-right: 12px; }
    .pill .dim { color: var(--text-dim); }
    .pill .chev { display: inline-flex; width: 16px; height: 16px; line-height: 0; color: var(--text-label); }
    .pill .chev svg { display: block; }

    /* Text slot whose width tweens to the incoming label (01) so the
       hugging pill grows instead of jumping, with the label itself
       swapping in place (04). Same construction as demo-example-skill. */
    .swap-slot {
      position: relative;
      display: inline-block;
      overflow: hidden;
      transition: width var(--resize-dur) var(--resize-ease);
      will-change: width;
    }
    .swap-measure { display: inline-block; visibility: hidden; white-space: nowrap; pointer-events: none; }
    .swap-slot .t-text-swap { position: absolute; top: 0; left: 0; white-space: nowrap; }

    /* Text states swap (04) */
    .t-text-swap {
      display: inline-block; transform: translateY(0); filter: blur(0); opacity: 1;
      transition:
        transform var(--text-swap-dur) var(--text-swap-ease),
        filter    var(--text-swap-dur) var(--text-swap-ease),
        opacity   var(--text-swap-dur) var(--text-swap-ease);
      will-change: transform, filter, opacity;
    }
    .t-text-swap.is-exit { transform: translateY(var(--text-swap-translate-y)); filter: blur(var(--text-swap-blur)); opacity: 0; }
    .t-text-swap.is-enter-start { transform: translateY(calc(var(--text-swap-translate-y) * -1)); filter: blur(var(--text-swap-blur)); opacity: 0; transition: none; }

    /* ══ 1 · Model picker (Figma 1531:41867 + 1531:41900) ══════════ */
    .dd-anchor {
      position: relative;
      display: inline-flex;
      flex-direction: column;
      align-items: flex-start;
    }
    /* Always open: the menu sits in flow under the pill, the way
       collection.html shows the component open in place. */
    .dd-shell {
      position: static;
      margin-top: 17px;
      z-index: 50;
    }
    .dropdown {
      width: 245px;
      padding: 6px;
      background: var(--bg-modal);
      border-radius: var(--radius-menu);
      box-shadow: var(--shadow-modal);
    }
    /* Menu dropdown (05): translateZ(0) pre-promotes the layer so the
       shadow rides in with the scale (Safari quirk). */
    .t-dropdown {
      transform-origin: top left;
      transform: scale(var(--dropdown-pre-scale)) translateZ(0);
      opacity: 0;
      pointer-events: none;
      transition:
        transform var(--dropdown-open-dur) var(--dropdown-ease),
        opacity   var(--dropdown-open-dur) var(--dropdown-ease);
      will-change: transform, opacity;
    }
    .t-dropdown.is-open { transform: scale(1) translateZ(0); opacity: 1; pointer-events: auto; }
    .t-dropdown.is-closing {
      transform: scale(var(--dropdown-closing-scale)) translateZ(0);
      opacity: 0; pointer-events: none;
      transition:
        transform var(--dropdown-close-dur) var(--dropdown-ease),
        opacity   var(--dropdown-close-dur) var(--dropdown-ease);
    }

    /* Body height tweens between the two pages (01) */
    .dd-body {
      position: relative;
      width: 100%;
      /* Clip only the height tween: the sides stay open by the panel's
         6px padding so the divider can run edge to edge. */
      clip-path: inset(0 -6px);
      transition: height var(--resize-dur) var(--resize-ease);
      will-change: height;
    }
    /* Page side-by-side (08) */
    .t-page-slide .t-page[data-page-id="1"] { --t-page-from-x: calc(var(--page-slide-distance) * -1); }
    .t-page-slide .t-page[data-page-id="2"] { --t-page-from-x: var(--page-slide-distance); }
    .t-page-slide .t-page {
      position: absolute;
      top: 0; left: 0; right: 0;
      display: flex;
      flex-direction: column;
      opacity: 0;
      pointer-events: none;
      transform: translateX(calc(var(--t-page-from-x, 0px) * var(--page-exit-enabled)));
      filter: blur(calc(var(--page-blur) * var(--page-exit-enabled)));
      transition:
        opacity   var(--page-fade-dur)  var(--page-fade-ease),
        transform var(--page-slide-dur) var(--page-slide-ease),
        filter    var(--page-slide-dur) var(--page-slide-ease);
      will-change: opacity, transform, filter;
    }
    .t-page-slide[data-page="1"] .t-page[data-page-id="1"],
    .t-page-slide[data-page="2"] .t-page[data-page-id="2"] {
      opacity: 1;
      pointer-events: auto;
      transform: translateX(0);
      filter: blur(0);
      transition-delay: var(--page-stagger);
    }

    .dd-row {
      display: flex; align-items: center; justify-content: space-between; gap: 6px;
      height: 36px; padding: 0 12px; border: 0;
      background: transparent; border-radius: var(--radius-row);
      color: var(--text-on-dropdown); cursor: pointer; text-align: left; width: 100%;
      font-size: 14px; line-height: 22px; font-weight: 400;
      transition: background-color 120ms ease;
    }
    .dd-row:hover { background: var(--bg-ghost-hover); }
    .dd-row[aria-checked="true"] { font-weight: 500; }
    .dd-row .row-icon { display: inline-flex; width: 16px; height: 16px; line-height: 0; flex: 0 0 16px; }
    .dd-row .row-icon svg { display: block; }
    /* The check swaps between rows with icon-swap timing */
    .dd-row .row-check { opacity: 0; transform: scale(0.25); filter: blur(2px);
      transition: opacity 200ms ease-in-out, transform 200ms ease-in-out, filter 200ms ease-in-out; }
    .dd-row[aria-checked="true"] .row-check { opacity: 1; transform: scale(1); filter: blur(0); }

    /* Page 2: effort header + slider (Figma 1531:41909) */
    /* Back sits at the left edge; label + value centre in the row. */
    .effort-head {
      position: relative;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      height: 36px; padding: 0 44px;
      font-size: 14px; line-height: 22px; font-weight: 500;
    }
    .effort-back {
      position: absolute; left: 4px; top: 2px;
      display: grid; place-items: center;
      width: 32px; height: 32px; padding: 0; border: 0;
      background: transparent; color: var(--text-on-dropdown); cursor: pointer; line-height: 0;
      border-radius: 50%;
      transition: background-color 120ms ease;
    }
    .effort-back:hover { background: var(--bg-ghost-hover); }
    .effort-back svg { display: block; }
    .effort-label { color: #878787; }
    /* The value slot keeps the width of "High" so the centred group
       never shifts as the label swaps; longer values overflow right. */
    .effort-value { color: #4c4c4c; overflow: visible; }

    .slider-row { height: 36px; padding: 7px 10px; }
    /* 1px, 2% black: separates the model list from the Effort row */
    .dd-divider { height: 1px; margin: 6px -6px; background: rgba(0, 0, 0, 0.04); }
    .slider {
      position: relative;
      width: 209px;
      height: 22px;
      border-radius: 122px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0.07) 0%, rgba(102, 102, 102, 0.07) 143%);
      box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.02);
    }
    /* Tick marks: 2px dots on the centre line (Figma 1533:41961) */
    .slider-ticks {
      position: absolute; left: 17px; right: 14px; top: 10px; height: 2px;
      display: flex; justify-content: space-between; pointer-events: none;
    }
    .slider-ticks i { width: 2px; height: 2px; border-radius: 1px; background: rgba(0, 0, 0, 0.12); }
    .slider-thumb {
      position: absolute; top: 3px; left: 3px;
      width: 16px; height: 16px; border-radius: 50%;
      background: #ffffff;
      box-shadow:
        0 0 0 1px rgba(0, 0, 0, 0.04),
        0 2px 6px 0 rgba(0, 0, 0, 0.05),
        0 4px 42px 0 rgba(0, 0, 0, 0.06);
      transition: left var(--resize-dur) var(--resize-ease);
      pointer-events: none;
    }
    /* The real control sits on top, invisible, so keyboard and drag
       both work; the visual thumb above tracks its value. */
    .slider input[type="range"] {
      position: absolute; inset: 0; width: 100%; height: 100%;
      margin: 0; opacity: 0; cursor: pointer;
      -webkit-appearance: none; appearance: none;
    }
    .slider input[type="range"]::-webkit-slider-thumb { -webkit-appearance: none; width: 22px; height: 22px; }
    .slider input[type="range"]::-moz-range-thumb { width: 22px; height: 22px; border: 0; }

    /* ══ 2 · Image generation (Figma 1531:41926) ═══════════════════ */
    .imagegen { width: 247px; align-items: flex-start; }
    .imagegen-label {
      height: 22px;
      font-size: 14px; line-height: 22px; font-weight: 500;
      color: var(--text-strong);
    }
    /* Shimmer text (15): the label is the base layer, ::before paints
       the sweeping highlight onto a duplicate of the same glyphs. */
    .t-shimmer {
      position: relative;
      display: inline-block;
      color: var(--shimmer-base);
    }
    .t-shimmer::before {
      content: attr(data-text);
      position: absolute;
      inset: 0;
      pointer-events: none;
      background-image: linear-gradient(
        90deg,
        transparent          0%,
        transparent         40%,
        var(--shimmer-highlight) 50%,
        transparent         60%,
        transparent        100%
      );
      background-size: var(--shimmer-band) 100%;
      background-repeat: no-repeat;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      -webkit-text-fill-color: transparent;
      animation: t-shimmer var(--shimmer-dur) var(--shimmer-ease) infinite;
    }
    @keyframes t-shimmer {
      0%   { background-position: 100% 0; }
      100% { background-position: 0% 0; }
    }
    /* The swapping label also has to be shimmer text, so the slot pins
       width and the swap element carries both class hooks. */
    /* Nothing sits beside this label, so it swaps in place with no
       width tween: the block spans the card and never clips. */
    .imagegen-label .swap-slot { display: block; width: 100% !important; height: 22px; overflow: visible; }

      -webkit-mask-size: 280% 280%; -webkit-mask-repeat: no-repeat; -webkit-mask-position: 100% 100%;
      mask-image: linear-gradient(135deg,

    }
    .t-organic-edge-ring,
    .t-organic-edge-glow,

      background:

      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);

        radial-gradient(ellipse 6.34% 12.68% at 2.1% 68.3%, rgba(var(--organic-teal), 0.25), transparent),

        radial-gradient(ellipse 33.80% 9.15% at 55% 100%, rgba(var(--organic-blue), 0.28), transparent),
        radial-gradient(ellipse 28.87% 11.97% at 93.9% 0%, rgba(var(--organic-orange), 0.35), transparent),

        radial-gradient(ellipse 25.35% 25.35% at 0% 0%, rgba(90, 90, 100, 0.14), transparent 70%),
        radial-gradient(ellipse 25.35% 25.35% at 100% 0%, rgba(90, 90, 100, 0.14), transparent 70%),
        radial-gradient(ellipse 25.35% 25.35% at 0% 100%, rgba(90, 90, 100, 0.14), transparent 70%),

      box-shadow: inset 0 0 calc(14px * var(--organic-scale)) calc(1px * var(--organic-scale)) rgba(90, 90, 100, 0.12);
      filter: blur(calc(2px * var(--organic-scale)));
      -webkit-mask-image:
        linear-gradient(white, transparent calc(44px * var(--organic-scale)), transparent calc(100% - 44px * var(--organic-scale)), white),
        linear-gradient(to right, white, transparent calc(44px * var(--organic-scale)), transparent calc(100% - 44px * var(--organic-scale)), white);
      -webkit-mask-composite: source-over;
      mask-image:
        linear-gradient(white, transparent calc(44px * var(--organic-scale)), transparent calc(100% - 44px * var(--organic-scale)), white),
        linear-gradient(to right, white, transparent calc(44px * var(--organic-scale)), transparent calc(100% - 44px * var(--organic-scale)), white);

    .t-organic-edge-bloom {

    /* ══ 3 · Publish → success modal (Figma 1531:41928) ════════════ */
    /* The card is always on, sitting below the Publish button with no
       backdrop; only its contents animate. */
    .publish-anchor {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      /* Extra air under the success card so it is not crowded by the
         prototype that follows. */
      margin-bottom: 60px;
    }

    /* The Figma success card. It never opens or closes now, so recipe
       06 is off here: the surface stands and Publish replays the check
       (10), the staggered copy (18) and the confetti. */
    .t-modal {
      position: relative;
      width: 262px;
      height: 165px;
      padding: 8px;
      border-radius: var(--radius-menu);
      background: var(--bg-modal);
      box-shadow: var(--shadow-modal);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;   /* confetti stage */
    }
    .success-body { display: flex; flex-direction: column; align-items: center; gap: 16px; width: 203px; position: relative; z-index: 1; }
    .success-texts { display: flex; flex-direction: column; gap: 6px; text-align: center; width: 100%; }
    /* Texts reveal (18), verbatim: lines rise in from below with a
       blur, the second held back by the stagger; exit is one quiet
       fade with no return travel. */
    .t-stagger-line {
      display: block;
      opacity: 0;
      transform: translateY(var(--stagger-distance));
      filter: blur(var(--stagger-blur));
      transition:
        opacity   var(--stagger-dur) var(--stagger-ease),
        transform var(--stagger-dur) var(--stagger-ease),
        filter    var(--stagger-dur) var(--stagger-ease);
      transition-delay: var(--stagger-delay);
      will-change: transform, opacity, filter;
    }
    .t-stagger-line--2 { transition-delay: calc(var(--stagger-delay) + var(--stagger-stagger)); }
    .t-stagger.is-shown .t-stagger-line {
      opacity: 1;
      transform: translateY(0);
      filter: blur(0);
    }
    .t-stagger.is-hiding .t-stagger-line {
      opacity: 0;
      transform: translateY(0);
      filter: blur(0);
      transition:
        opacity 200ms ease,
        transform 0s linear,
        filter 0s linear;
      transition-delay: 0s;
    }
    .success-title { margin: 0; font-size: 13px; line-height: 16px; font-weight: 500; color: #1f1f1f; }
    .success-copy  { margin: 0; font-size: 12px; line-height: 16px; color: var(--text-muted); }

    /* Figma 1531:41943 badge: 28px, soft green gradient, inset ring */
    .success-badge-slot { width: 28px; height: 28px; line-height: 0; }
    .success-disc {
      display: grid; place-items: center;
      width: 28px; height: 28px; border-radius: 50%;
      background: linear-gradient(180deg, rgba(161, 245, 129, 0.3) 0%, rgba(180, 227, 162, 0.3) 100%);
      box-shadow:
        0 1px 4px 0 rgba(64, 205, 15, 0.1),
        inset 0 0 0 1px rgba(19, 141, 6, 0.05),
        inset 0 -1px 0 0 rgba(65, 190, 51, 0.15);
    }
    /* Success check (10), verbatim */
    .t-success-check {
      display: inline-block;
      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    .t-success-check svg { display: block; overflow: visible; }
    .t-success-check svg path { stroke-dasharray: 20; stroke-dashoffset: 20; }
    .t-success-check[data-state="in"] {
      animation:
        t-check-fade   var(--check-opacity-dur) var(--check-ease-opacity) forwards,
        t-check-rotate var(--check-rotate-dur)  var(--check-ease-rotate)  forwards,
        t-check-blur   var(--check-blur-dur)    var(--check-ease-out)     forwards,
        t-check-bob    var(--check-bob-dur)     var(--check-ease-bob)     forwards;
    }
    .t-success-check[data-state="in"] svg path {
      animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
    }
    @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t-check-rotate { from { transform: rotate(var(--check-rotate-from)); } to { transform: rotate(0deg); } }
    @keyframes t-check-blur { from { filter: blur(var(--check-blur-from)); } to { filter: blur(0); } }
    @keyframes t-check-bob { from { translate: 0 var(--check-y-amount); } to { translate: 0 0; } }
    @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

    /* Confetti (Pro): the modal is the stage, the badge the collider */
    .t-confetti-canvas {
      position: absolute; inset: 0; width: 100%; height: 100%;
      z-index: 2; pointer-events: none;
      transition: opacity 200ms ease;   /* the pile fades with the rest on replay */
    }

    /* ══ 4 · Email input (Figma 1533:41990 / 41995 / 42000) ═════════ */
    .t-input-wrap { display: flex; flex-direction: column; gap: 4px; width: 232px; }
    /* A constant 1.5px border across states keeps the tween from
       shifting the text (recipe 12); the Figma rest state draws 1px. */
    .t-input {
      height: 40px;
      padding: 4px 4px 4px 14px;
      /* 1px at rest; focus and error thicken to 1.5px with an inset ring
         so the box never reflows. */
      border: 1px solid #dcdcdc;
      box-shadow: inset 0 0 0 0.5px transparent;
      border-radius: var(--radius-pill);
      background: var(--bg-modal);
      color: var(--text-strong);
      font-size: 13px;
      line-height: 1.4;
      outline: 0;
      transition: border-color 150ms ease-out, box-shadow 150ms ease-out;
      will-change: transform;
    }
    .t-input::placeholder { color: var(--text-strong); opacity: 1; }
    .t-input:focus { border-color: #585858; box-shadow: inset 0 0 0 0.5px #585858; }
    .t-input.is-error, .t-input.is-error:focus {
      border-color: #e23014;
      box-shadow: inset 0 0 0 0.5px #e23014;
      transition: border-color var(--revert-dur, 280ms) ease-out, box-shadow var(--revert-dur, 280ms) ease-out;
    }
    .t-error-msg {
      font-size: 13px; line-height: 1.4; color: #d62b11;
      opacity: 0;
      visibility: hidden;
      transition:
        opacity    var(--revert-dur, 280ms) ease-out,
        visibility 0s linear var(--revert-dur, 280ms);
    }
    .t-input-wrap.is-error .t-error-msg {
      opacity: 1;
      visibility: visible;
      transition:
        opacity    var(--revert-dur, 280ms) ease-out,
        visibility 0s linear 0s;
    }
    /* Stops: 80, 60, 80, 60 = 280ms → 28.57 / 57.14 / 78.57 / 100 */
    .t-input.is-shaking {
      animation: t-input-shake calc(var(--shake-dur-a) * 2 + var(--shake-dur-b) * 2) linear;
    }
    @keyframes t-input-shake {
      0%      { transform: translateX(0);                                 animation-timing-function: var(--shake-ease); }
      28.57%  { transform: translateX(var(--shake-distance));             animation-timing-function: var(--shake-ease); }
      57.14%  { transform: translateX(calc(var(--shake-distance) * -1)); animation-timing-function: var(--shake-ease); }
      78.57%  { transform: translateX(var(--shake-overshoot));            animation-timing-function: var(--shake-ease); }
      100%    { transform: translateX(0); }
    }

    /* ══ 5 · Team: avatar group hover (11) ══════════════════════════ */
    .t-avatar-group { position: relative; display: flex; }
    .t-avatar {
      transform-origin: center;
      transform: translateY(var(--shift, 0px)) scale(var(--scale-active, 1));
      transition: transform var(--avatar-dur) var(--avatar-ease-in);
      will-change: transform;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--bg-page);
      overflow: hidden;
      flex-shrink: 0;
      background: #f4f4f4;
    }
    .t-avatar + .t-avatar { margin-left: -8px; }
    .t-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .t-avatar.is-more {
      display: grid; place-items: center;
      background: #e9e9e9;
      font-size: 11px; font-weight: 500; color: var(--text-muted);
    }
    /* Shared name tooltip, same as collection.html */
    .avatar-tooltip {
      position: absolute;
      left: 0; bottom: calc(100% + 8px);
      transform: translateX(0);
      height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 40px;
      font-size: 12px; line-height: 16px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 80;
      opacity: 0; visibility: hidden;
      width: 0; overflow: hidden;
      background: #ffffff; color: var(--text-on-dropdown);
      box-shadow:
        0 2px 8px 0 rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(0, 0, 0, 0.06),
        0 1px 1px 0 rgba(0, 0, 0, 0.04);
      transition:
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
        width 160ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 120ms cubic-bezier(0.22, 1, 0.36, 1) 50ms,
        visibility 0s linear 170ms;
    }
    .avatar-tooltip[data-show="true"] {
      opacity: 1; visibility: visible;
      transition:
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
        width 160ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 120ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }
    .avatar-tooltip-text { display: inline-block; white-space: nowrap; line-height: 32px; }

    /* ── Dev panel: live tuning for the organic shimmer ───────────── */
    .devpanel {
      position: fixed; right: 16px; bottom: 16px; z-index: 200;
      width: 248px;
      background: var(--bg-modal);
      border-radius: 14px;
      box-shadow: var(--shadow-modal);
      font-size: 12px; line-height: 16px;
      color: var(--text-strong);
    }
    .devpanel-head {
      display: flex; align-items: center; justify-content: space-between;
      width: 100%; height: 36px; padding: 0 12px;
      border: 0; background: transparent; color: inherit;
      font-size: 12px; font-weight: 500; cursor: pointer; text-align: left;
    }
    .devpanel-head .chev { display: inline-flex; transition: transform 200ms cubic-bezier(0.22, 1, 0.36, 1); }
    .devpanel[data-open="false"] .devpanel-head .chev { transform: rotate(180deg); }
    .devpanel-body { padding: 0 12px 12px; display: flex; flex-direction: column; gap: 8px; }
    .devpanel[data-open="false"] .devpanel-body { display: none; }
    .devpanel-group { margin: 6px 0 2px; font-size: 11px; font-weight: 500; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
    .devrow { display: grid; grid-template-columns: 76px 1fr 44px; align-items: center; gap: 8px; }
    .devrow label { color: var(--text-muted); }
    .devrow input[type="range"] { width: 100%; margin: 0; accent-color: #1b1b1b; }
    .devrow input[type="color"] {
      width: 100%; height: 22px; padding: 0; border: 0; background: transparent; cursor: pointer;
    }
    .devrow input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    .devrow input[type="color"]::-webkit-color-swatch { border: 1px solid rgba(0,0,0,0.08); border-radius: 6px; }
    .devrow output { font-variant-numeric: tabular-nums; text-align: right; color: var(--text-muted); }
    .devpanel-presets { display: flex; flex-wrap: wrap; gap: 6px; }
    .devpanel-presets .pill { height: 26px; padding: 0 10px; font-size: 12px; }
    .devpanel-presets .pill[aria-pressed="true"] { background: #1b1b1b; color: #ffffff; }
    .devpanel-actions { display: flex; gap: 6px; margin-top: 4px; }
    .devpanel-actions .pill { height: 28px; padding: 0 12px; font-size: 12px; flex: 1; }

    /* ══ 6 · Toast stacking (Figma 1537:43527 on homepage P34) ═════ */
    /* No separate trigger: clicking anywhere on the stage adds a toast. */
    .toast-stage {
      position: relative;
      cursor: pointer;
      outline: none;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 320px;
      /* The spread column (three toasts plus two gaps) is 139px; the
         stage reserves 60px less so the stack sits closer to the picker,
         and the spread simply overflows upward. Spread tracking is
         geometry on the document, so leaving the stage box does not
         collapse it. */
      height: 79px;
      padding-bottom: 0;
      /* The spread column overflows upward over the picker, so the
         stage owns a stacking context above every other prototype. */
      z-index: 60;
    }
    .t-stack {
      position: relative;
      width: 195px;
      height: 41px;
    }
    /* The Figma toast pill */
    .t-stack-toast {
      position: absolute;
      left: 0;
      bottom: 0;
      display: flex;
      align-items: center;
      gap: 8px;
      width: 195px;
      height: 41px;
      padding: 6px 12px 6px 10px;
      background: var(--bg-modal);
      border-radius: 82px;
      box-shadow: var(--shadow-modal);
      /* Centre origin so an arriving toast scales exactly like the
         toast recipe; the push-back states switch to the bottom edge,
         which is safe because the swap happens at identity. */
      transform-origin: 50% 50%;
      /* Explicit blur(0): blur to none does not interpolate reliably. */
      filter: blur(0);
      will-change: transform, opacity, filter;
      transition:
        transform var(--stack-open) var(--stack-ease),
        opacity   var(--stack-open) var(--stack-ease),
        filter    var(--stack-open) var(--stack-ease);
    }
    .t-stack-toast[data-depth="0"] { z-index: 3; transform: translateY(0) scale(1); opacity: 1; }
    .t-stack-toast[data-depth="1"] {
      z-index: 2;
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--stack-peek) * -1)) scale(calc(1 - var(--stack-depth-scale)));
      opacity: calc(1 - var(--stack-depth-fade));
      filter: blur(var(--stack-depth1-blur));
    }
    .t-stack-toast[data-depth="2"] {
      z-index: 1;
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--stack-peek) * -2)) scale(calc(1 - var(--stack-depth-scale) * 2));
      opacity: calc(1 - var(--stack-depth-fade) * 1.6);
      filter: blur(var(--stack-depth2-blur));
    }
    /* Spread: newest stays, older ones climb one toast height each. */
    .t-stack.is-spread .t-stack-toast[data-depth="1"],
    .t-stack.is-spread .t-stack-toast[data-depth="2"] { opacity: 1; filter: blur(0); }
    .t-stack.is-spread .t-stack-toast[data-depth="1"] { transform: translateY(calc((41px + var(--stack-spread-gap)) * -1)) scale(1); }
    .t-stack.is-spread .t-stack-toast[data-depth="2"] { transform: translateY(calc((41px + var(--stack-spread-gap)) * -2)) scale(1); }
    .t-stack-toast.is-enter {
      transition: none;
      transform: translateY(var(--stack-distance)) scale(var(--stack-scale-in));
      opacity: 0;
      filter: blur(var(--stack-blur));
    }
    .t-stack-toast.is-leaving {
      z-index: 0;
      transform-origin: 50% 100%;
      transform: translateY(calc(var(--stack-peek) * -3)) scale(calc(1 - var(--stack-depth-scale) * 3));
      opacity: 0;
      filter: blur(var(--stack-blur));
      transition:
        transform var(--stack-close) var(--stack-ease),
        opacity   var(--stack-close) var(--stack-ease),
        filter    var(--stack-close) var(--stack-ease);
    }
    /* Figma 1537:43699 check box */
    .toast-check {
      display: grid; place-items: center;
      width: 24px; height: 24px; flex: 0 0 24px;
      border-radius: 50%;
      background: linear-gradient(180deg, rgba(161, 245, 129, 0.2) 0%, rgba(180, 227, 162, 0.2) 100%);
      box-shadow:
        0 1px 4px 0 rgba(64, 205, 15, 0.1),
        inset 0 0 0 1px rgba(11, 109, 0, 0.05),
        inset 0 -1px 0 0 rgba(65, 190, 51, 0.15);
    }
    .toast-check svg { display: block; }
    .toast-text {
      flex: 1;
      font-size: 13px; line-height: 1.4; font-weight: 500;
      color: var(--text-strong);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .toast-close {
      display: grid; place-items: center;
      width: 20px; height: 20px; flex: 0 0 20px;
      padding: 0; border: 0; border-radius: 50%;
      background: transparent; color: #8a8a8a; cursor: pointer;
      transition: background-color 120ms ease, color 120ms ease;
    }
    .toast-close:hover { background: var(--bg-ghost-hover); color: var(--text-strong); }
    .toast-close svg { display: block; }

    /* ══ 7 · Toggle (27), from demo-example-skill.html ══════════════ */
    /* The switch stands alone: no label, so the row just centres it. */
    .toggle-row {
      display: flex; align-items: center; justify-content: center;
      height: 32px;
    }
    .t-toggle {
      display: block;
      width: 40px; height: 20px;
      flex: 0 0 40px;
      padding: 0;
      border: 0;
      border-radius: 122px;
      background: var(--toggle-track-off);
      position: relative;
      cursor: pointer;
      transition: background var(--toggle-track) var(--toggle-ease),
                  background-color 200ms ease;
    }
    .t-toggle[data-on="true"] { background: var(--toggle-track-on); }
    .t-toggle-thumb {
      position: absolute;
      left: 3.33px; top: 3.33px;
      width: 20px; height: 13.34px;
      border-radius: 122px;
      background: var(--toggle-thumb-bg);
      box-shadow:
        0 2px 6px 0 rgba(0, 0, 0, 0.05),
        0 4px 42px 0 rgba(0, 0, 0, 0.06),
        0 1px 2px rgba(0, 0, 0, 0.18);
      translate: 0 0;
      will-change: translate;
    }
    .t-toggle[data-on="true"] .t-toggle-thumb { translate: var(--toggle-travel) 0; }
    .t-toggle.is-init[data-on="true"] .t-toggle-thumb { animation: t-toggle-on var(--toggle-dur) var(--toggle-ease) both; }
    .t-toggle.is-init[data-on="false"] .t-toggle-thumb { animation: t-toggle-off var(--toggle-dur) var(--toggle-ease) both; }
    @keyframes t-toggle-on {
      0% { translate: 0 0; }
      55% { translate: calc(var(--toggle-travel) + var(--toggle-ov1)) 0; }
      80% { translate: calc(var(--toggle-travel) - var(--toggle-ov2)) 0; }
      100% { translate: var(--toggle-travel) 0; }
    }
    @keyframes t-toggle-off {
      0% { translate: var(--toggle-travel) 0; }
      55% { translate: calc(0px - var(--toggle-ov1)) 0; }
      80% { translate: var(--toggle-ov2) 0; }
      100% { translate: 0 0; }
    }

    /* ══ 8 · Notification badge (03), the homepage bell ═════════════ */
    .bell {
      position: relative;
      width: 40px; height: 40px;
      padding: 0; border: 0;
      border-radius: 40px;
      background: var(--bg-modal);
      box-shadow:
        0 1px 0 0 rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(0, 0, 0, 0.04),
        0 2px 3px 0 rgba(0, 0, 0, 0.04);
      display: inline-flex; align-items: center; justify-content: center;
      color: var(--text-strong);
      cursor: pointer;
    }
    .bell > svg { width: 16px; height: 16px; display: block; }
    /* Recipe 03, verbatim: the wrapper slides in diagonally, the dot
       pops with the spring. */
    @keyframes t-badge-slide-in {
      from { transform: translate(var(--badge-offset-x), var(--badge-offset-y)); }
      to   { transform: translate(0, 0); }
    }
    .t-badge {
      position: absolute;
      top: -6px;
      right: -8px;
      width: 20px; height: 20px;
      pointer-events: none;
      will-change: transform;
    }
    .t-badge[data-open="true"] { animation: t-badge-slide-in var(--badge-slide-dur) var(--badge-slide-ease); }
    .t-badge-dot {
      display: flex; width: 100%; height: 100%;
      align-items: center; justify-content: center;
      border-radius: 50%;
      background-image: linear-gradient(-51.52deg, rgb(238, 41, 51) 13.929%, rgb(236, 2, 72) 112.7%);
      color: #ffffff;
      font-weight: 500;
      font-size: 11.744px;
      line-height: 1;
      letter-spacing: -0.1174px;
      box-shadow:
        0 0.338px 1.351px 0 rgba(0, 0, 0, 0.17),
        0 0.676px 2.703px 0 rgba(0, 0, 0, 0.04),
        inset 0 -0.338px 0 0 rgba(0, 0, 0, 0.16);
      transform-origin: center;
      transform: scale(1);
      opacity: 1;
      filter: blur(0);
      transition:
        transform var(--badge-pop-dur)  var(--badge-pop-ease),
        opacity   var(--badge-fade-dur) var(--badge-pop-ease),
        filter    var(--badge-pop-dur)  var(--badge-pop-ease);
      will-change: transform, opacity, filter;
    }
    .t-badge[data-open="false"] .t-badge-dot {
      transform: scale(0);
      opacity: 0;
      filter: blur(var(--badge-blur));
      transition:
        transform var(--badge-pop-close-dur)  var(--badge-close-ease),
        opacity   var(--badge-fade-close-dur) var(--badge-close-ease),
        filter    var(--badge-pop-close-dur)  var(--badge-close-ease);
    }

    /* ── "Generic AI output" mode ─────────────────────────────────────
       Every recipe is neutralised through its own variables (not by
       overriding properties) so the hooks stay live and Refine can
       raise them to the skill values on apply. */
    @media (prefers-reduced-motion: no-preference) {
      /* Picker: chunky page slide, no blur; labels cross-fade in place,
         widths snap. */
      body[data-style="generic"] .proto-root .dd-anchor {
        --page-slide-distance: 30px;
        --page-slide-dur: 300ms;
        --page-fade-dur: 300ms;
        --page-slide-ease: ease-in-out;
        --page-fade-ease: ease-in-out;
        --page-blur: 0px;
        --resize-dur: 0ms;
        --text-swap-blur: 0px;
        --text-swap-translate-y: 0px;
        --text-swap-ease: ease-in-out;
      }
      body[data-style="generic"] .proto-root .dd-body { transition: height 300ms ease-in-out; }
      body[data-style="generic"] .proto-root .slider-thumb { transition: left 200ms linear; }
      body[data-style="generic"] .proto-root .dd-row .row-check { transition: opacity 200ms ease-in-out; transform: none; filter: none; }

      /* Image generation: the stock skeleton shimmer, a horizontal
         highlight sweeping left to right on a linear clock. The organic
         layers are dropped entirely; the label just fades between
         states. */
      body[data-style="generic"] .proto-root .imagegen {
        --text-swap-blur: 0px;
        --text-swap-translate-y: 0px;
        --text-swap-ease: ease-in-out;
      }
      body[data-style="generic"] .proto-root .t-organic,
      body[data-style="generic"] .proto-root .t-organic-edge { display: none; }
      body[data-style="generic"] .proto-root .t-organic-tile {
        /* a darker grey band, not a highlight */
        background-image: linear-gradient(90deg, #eeeeee 0%, #eeeeee 38%, #e0e0e0 50%, #eeeeee 62%, #eeeeee 100%);
        background-size: 200% 100%;
        background-repeat: no-repeat;
        animation: generic-shimmer 1800ms linear infinite;
        filter: none;
      }
      @keyframes generic-shimmer {
        from { background-position: 100% 0; }
        to   { background-position: -100% 0; }
      }
      body[data-style="generic"] .proto-root .t-shimmer::before { animation: none; }

      /* Publish: check and copy just fade, no rotate / bob / draw / stagger;
         the confetti falls stiff with no sway or bounce. */
      body[data-style="generic"] .proto-root .publish-anchor {
        --check-rotate-from: 0deg;
        --check-y-amount: 0px;
        --check-blur-from: 0px;
        --check-path-dur: 0ms;
        --check-path-delay: 0ms;
        --check-opacity-dur: 300ms;
        --check-rotate-dur: 300ms;
        --check-blur-dur: 300ms;
        --check-bob-dur: 300ms;
        --stagger-distance: 0px;
        --stagger-blur: 0px;
        --stagger-stagger: 0ms;
        --stagger-dur: 300ms;
        --stagger-ease: ease-in-out;
        --confetti-sway: 0;
        --confetti-bounce: 0;
      }

      /* Email: linear shake, half again as slow, no overshoot, message
         snaps in. The keyframe stops are ratios, so scaling both legs
         together keeps them in sync. */
      body[data-style="generic"] .proto-root .t-input-wrap {
        --shake-ease: linear;
        --shake-overshoot: 0px;
        --shake-dur-a: 120ms;
        --shake-dur-b: 90ms;
        --revert-dur: 0ms;
      }

      /* Team: only the hovered avatar lifts, no falloff, no spring.
         The tooltip is not continuous either: it never tweens its width
         or position between names, so moving along the row tears the
         old one down and puts a new one up (see the JS below). */
      body[data-style="generic"] .proto-root .t-avatar-group {
        --avatar-falloff: 0;
        --avatar-ease-in: ease-in-out;
        --avatar-ease-out: ease-in-out;
      }
      body[data-style="generic"] .proto-root .avatar-tooltip {
        transition:
          opacity 120ms ease-in-out,
          visibility 0s linear 120ms;
      }
      body[data-style="generic"] .proto-root .avatar-tooltip[data-show="true"] {
        transition:
          opacity 120ms ease-in-out,
          visibility 0s linear 0s;
      }

      /* Toast: keeps the skill pane's depth scaling and fade, but no
         blur anywhere, and the new toast arrives on a plain ease-out. */
      body[data-style="generic"] .proto-root .toast-stage {
        --stack-blur: 0px;
        --stack-scale-in: 1;
        --stack-depth1-blur: 0px;
        --stack-depth2-blur: 0px;
        --stack-open: 368ms;   /* 525ms, 30% faster */
        --stack-ease: ease-out;
      }

      /* Toggle: plain slide, no overshoot spring. */
      body[data-style="generic"] .proto-root .t-toggle-thumb {
        animation: none !important;
        transition: translate 263ms ease-in-out;   /* 375ms, 30% faster */
      }

      /* Badge: no diagonal slide, no spring, no blur. */
      body[data-style="generic"] .proto-root .bell {
        --badge-offset-x: 0px;
        --badge-offset-y: 0px;
        --badge-blur: 0px;
        --badge-pop-ease: ease-in-out;
        --badge-pop-dur: 250ms;
        --badge-fade-dur: 250ms;
      }
    }

    /* prefers-reduced-motion, required by every recipe */
    @media (prefers-reduced-motion: reduce) {
      .t-text-swap, .swap-slot, .t-dropdown, .dd-body, .t-page-slide .t-page,
      .slider-thumb, .t-modal, .t-error-msg, .avatar-tooltip,
      .t-stagger-line {
        transition: none !important;
      }
      .t-avatar { transition: none !important; transform: none !important; }
      .t-stack-toast { transition: none !important; transform: none !important; filter: none !important; }
      .t-toggle-thumb { animation: none !important; }
      .t-badge, .t-badge-dot { animation: none !important; transition: none !important; }
      .t-input { animation: none !important; transform: none !important; }
      .t-shimmer::before, .t-organic-band, .t-organic-edge,
      .t-success-check, .t-success-check svg path { animation: none !important; }
      .t-success-check[data-state="in"] { opacity: 1; }
      .t-success-check[data-state="in"] svg path { stroke-dashoffset: 0; }
    }
  </style>

  <script>
    (function () {
      "use strict";
      /* Embed init: the iframes flag themselves so the article renders
         and the generic pane picks up its overrides. Runs before any
         prototype reads its variables. */
      (function initEmbed() {
        var params = new URLSearchParams(window.location.search);
        if (params.get("embed") !== "1") return;
        document.documentElement.dataset.embed = "true";
        document.body.dataset.embed = "true";
        if (params.get("style") === "generic") document.body.dataset.style = "generic";
        /* Start collapsed inside the pane so it doesn't sit on the demos. */
        var panel = document.getElementById("devpanel");
        if (panel) {
          panel.setAttribute("data-open", "false");
          var head = document.getElementById("devpanelToggle");
          if (head) head.setAttribute("aria-expanded", "false");

      })();

      var rootStyle = getComputedStyle(document.documentElement);
      function cssNum(name, fb) {
        var v = parseFloat(rootStyle.getPropertyValue(name));

      }

      /* ── Text states swap (04) + width tween (01) helpers ───────── */
      var textSwapAt = Math.max(0, cssNum("--text-swap-dur", 150) + cssNum("--text-swap-enter-delay", 0));
      function swapText(el, next, alsoDataText) {
        if (el.textContent === next) return;
        el.classList.add("is-exit");
        setTimeout(function () {
          el.textContent = next;
          if (alsoDataText) el.setAttribute("data-text", next);
          el.classList.remove("is-exit");
          el.classList.add("is-enter-start");
          void el.offsetHeight;
          el.classList.remove("is-enter-start");
        }, textSwapAt);
      }
      function sizeSlot(slot, measure, label, animate) {
        measure.textContent = label;
        var next = Math.ceil(measure.getBoundingClientRect().width);
        if (!animate) {
          var prev = slot.style.transition;
          slot.style.transition = "none";
          slot.style.width = next + "px";
          void slot.offsetWidth;
          slot.style.transition = prev;
        } else {
          slot.style.width = next + "px";
        }
      }
      function makeSwapSlot(slotId, measureId, textId, alsoDataText, noSize) {
        var slot = document.getElementById(slotId);
        var measure = document.getElementById(measureId);
        var text = document.getElementById(textId);
        if (!noSize) {
          sizeSlot(slot, measure, text.textContent, false);
          if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(function () { sizeSlot(slot, measure, text.textContent, false); });
          }
