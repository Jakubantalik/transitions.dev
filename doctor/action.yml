name: "Transitions Doctor"
description: "Scan pull requests for missing or janky UI transitions. Posts a motion score comment and can gate merges on a minimum score."
branding:
  icon: "activity"
  color: "purple"

inputs:
  min-score:
    description: "Fail the check when the motion score is below this number (0 disables the gate)."
    default: "0"
  comment:
    description: "Post or update a motion score comment on the pull request."
    default: "true"
  working-directory:
    description: "Directory to scan."
    default: "."
  github-token:
    description: "Token used to post the PR comment."
    default: ${{ github.token }}

outputs:
  score:
    description: "The motion score (0-100)."
    value: ${{ steps.scan.outputs.score }}

runs:
  using: "composite"
  steps:
    - name: Scan
      id: scan
      shell: bash
      run: |
        node "${{ github.action_path }}/bin/transitions-doctor.mjs" --json --dir "${{ inputs.working-directory }}" > "$RUNNER_TEMP/tdoc.json"
        node "${{ github.action_path }}/action/comment.mjs" "$RUNNER_TEMP/tdoc.json" > "$RUNNER_TEMP/tdoc-comment.md"
        echo "score=$(node -p "JSON.parse(require('fs').readFileSync(process.env.RUNNER_TEMP + '/tdoc.json','utf8')).score")" >> "$GITHUB_OUTPUT"

    - name: Comment on PR
      if: ${{ inputs.comment == 'true' && github.event_name == 'pull_request' }}
      uses: actions/github-script@v7
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require("fs");
          const body = fs.readFileSync(process.env.RUNNER_TEMP + "/tdoc-comment.md", "utf8");
          const marker = "<!-- transitions-doctor -->";
          const { owner, repo } = context.repo;
          const issue_number = context.payload.pull_request.number;
          const comments = await github.rest.issues.listComments({ owner, repo, issue_number, per_page: 100 });
          const existing = comments.data.find((c) => c.body && c.body.includes(marker));
          if (existing) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - name: Score gate
      if: ${{ inputs.min-score != '0' }}
      shell: bash
      run: |
        score=${{ steps.scan.outputs.score }}
        min=${{ inputs.min-score }}
        if [ "$score" -lt "$min" ]; then
          echo "Motion score $score is below the required minimum $min."
          exit 1
        fi
        echo "Motion score $score meets the minimum $min."
