<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>UI generation demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..600&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./ui-generation.css" />
<style>
  /* the Community stage the components were built on (custom properties reach into each component's shadow root) */
  :root { --stage-bg: #fbfbfb; --stage-fg: #0d0d0d; --stage-muted: #6c6c6c; --stage-border: rgba(0,0,0,.08); --stage-surface: #fff; --stage-accent: #17181c; --stage-on-accent: #fff; color-scheme: light; }
  html[data-theme="dark"] { --stage-bg: #0b0b0c; --stage-fg: #f2f2f2; --stage-muted: rgba(202,202,202,.7); --stage-border: rgba(255,255,255,.08); --stage-surface: #1d1d1d; --stage-accent: #fff; --stage-on-accent: #0d0d0d; color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; background: var(--stage-bg); color: var(--stage-fg); font: 400 13px/20px Inter, system-ui, sans-serif; font-optical-sizing: auto; -webkit-font-smoothing: antialiased; }
  .demo-bar { position: sticky; top: 0; z-index: 2; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; padding: 16px; font-size: 14px; }
  .demo-bar button { height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--stage-border); color: var(--stage-fg); font: inherit; font-weight: 500; cursor: pointer; }
  .demo-bar button[aria-pressed="true"] { background: var(--stage-fg); color: var(--stage-bg); }
  .demo-bar a { height: 34px; display: inline-flex; align-items: center; padding: 0 14px; border-radius: 999px; background: var(--stage-border); color: var(--stage-fg); font-weight: 500; text-decoration: none; }
  .demo-stage { display: flex; flex-wrap: wrap; gap: 40px; align-items: flex-start; justify-content: center; padding: 64px 16px 180px; }
  .demo-item { display: flex; flex-direction: column; align-items: center; gap: 14px; }
  .demo-credit { font-size: 12px; color: var(--stage-muted); text-decoration: none; }
  .demo-credit:hover { color: var(--stage-fg); }
  body.is-single .demo-item:not(:first-child) { display: none; }
  body.is-single .demo-stage { padding-top: 120px; }
</style>
<script>if (matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.dataset.theme = "dark";</script>
</head>
<body>
  <div class="demo-bar" role="toolbar" aria-label="Demo controls">
    <button data-mode="skeleton" aria-pressed="true">Skeleton</button>
    <button data-mode="skeleton-texts" aria-pressed="false">Skeleton + generation texts</button>
    <button id="layout" aria-pressed="false">One card</button>
    <button id="replay">Replay</button>
    <a href="./demo-text.html">Text</a>
    <a href="./demo-editorial.html">Text and images</a>
  </div>

  <!-- three components published on the transitions.dev Community, mounted as published -->
  <main class="demo-stage" id="stage"></main>

<script type="module">
  import { generate } from "./ui-generation.js";

  // Each component lives in its own shadow root, so their styles and class names never meet.
  // Its script gets a `document` scoped to that root: queries look inside it, documentElement is the host
  // (where its :root tokens now live), everything else is the real document.
  const scopedDocument = (root, host) => new Proxy(document, {
    get(target, prop) {
      if (prop === "querySelector" || prop === "querySelectorAll" || prop === "getElementById") return (...a) => (prop === "getElementById" ? root.querySelector("#" + CSS.escape(a[0])) : root[prop](...a));
      if (prop === "documentElement" || prop === "body") return host;
      const v = Reflect.get(target, prop);
      return typeof v === "function" ? v.bind(target) : v;
    },
  });
  // one card shadow for all three (the Music Player's), so the demo reads as one set
  const CARD_SHADOW = "0 0 0 1px rgba(0,0,0,.07), 0 8px 32px -4px rgba(0,0,0,.08), 0 1px 3px 0 rgba(0,0,0,.07)";
  const stage = document.getElementById("stage");
  const items = JSON.parse(document.getElementById("components").textContent).map((c) => {
    const item = document.createElement("div"); item.className = "demo-item";
    const host = document.createElement("div"); host.dataset.theme = document.documentElement.dataset.theme || "light";
    const root = host.attachShadow({ mode: "open" });
    root.innerHTML = `<style>${c.css}</style>${c.html}`;
    const credit = Object.assign(document.createElement("a"), { className: "demo-credit", href: `https://transitions.dev/studio.html?id=${c.id}`, textContent: c.title });
    item.append(host, credit); stage.append(item);
    try { new Function("document", c.js)(scopedDocument(root, host)); } catch (e) { console.warn(c.title, e); }
    const el = [...root.children].find((n) => n.tagName !== "STYLE");
    el.style.boxShadow = CARD_SHADOW;
    return { el, item, title: c.title };
  });

  let mode = "skeleton";
  const play = async () => {
    await document.fonts.ready;
    items.filter((it) => it.item.offsetParent).forEach((it, i) => generate(it.el, { mode, delay: i * 260, done: it.title + " ready" }));
  };
  document.querySelectorAll("[data-mode]").forEach((b) => b.addEventListener("click", () => {
    mode = b.dataset.mode;
    document.querySelectorAll("[data-mode]").forEach((x) => x.setAttribute("aria-pressed", String(x === b)));
    play();
  }));
  document.getElementById("replay").addEventListener("click", play);
  document.getElementById("layout").addEventListener("click", (e) => {
    const on = document.body.classList.toggle("is-single"); e.currentTarget.setAttribute("aria-pressed", String(on));
    items.forEach((it) => it.el.__tGen && it.el.__tGen.cancel()); play();
  });
  play();
</script>
