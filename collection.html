<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>Transitions.dev — Collection</title>
  <meta name="description" content="Live showcase of the transitions.dev library — every component demos its transition through real interaction." />
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#fdfdfd" />

  <link rel="icon" href="assets/favicon-light-mode.png?v=4" type="image/png" sizes="any" />
  <link rel="icon" href="assets/favicon-light-mode.png?v=4" media="(prefers-color-scheme: light)" type="image/png" />
  <link rel="icon" href="assets/favicon-darkmode.png?v=4" media="(prefers-color-scheme: dark)" type="image/png" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />

  <style>

    /* ── iOS double-tap zoom ─────────────────────────────────────────
       iOS Safari ignores `user-scalable=no` / `maximum-scale=1` in the
       viewport meta (since iOS 10), and disabling pinch zoom outright
       would fail WCAG 1.4.4. `touch-action: manipulation` suppresses
       only the double-tap-to-zoom gesture on the things people tap,
       leaving pinch zoom fully intact. Declared first in the sheet so
       prototypes needing a stricter value (`touch-action: none` on the
       tilt / drag demos) still override it further down. */
    button,
    a,
    label,
    summary,
    input,
    select,
    [role="button"],
    [role="switch"],
    [role="checkbox"],
    [role="tab"],
    .card {
      touch-action: manipulation;
    }
    /* ══ Site foundations (from index.html) ═════════════════════ */
    :root {
      color-scheme: light;
      --bg: #fdfdfd;
      --text: #0d0d0d;
      --text-muted: #6c6c6c;
      --chip-bg: #f4f4f4;
      --chip-bg-hover: #f1f1f1;
      --skeleton: #eeeeef;
      --material-bg: #ffffff;
      --material-shadow:
        0 4px 42px 0 rgba(0, 0, 0, 0.06),
        0 2px 6px 0 rgba(0, 0, 0, 0.05),
        0 0 0 1px rgba(0, 0, 0, 0.06);
      --font-sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI",
        Roboto, Helvetica, Arial, sans-serif;

      /* ══ transitions-dev motion tokens (skills/transitions-dev/_root.css) ══ */
      /* Avatar group hover */
      --avatar-lift: -4px;
      --avatar-dur: 320ms;
      --avatar-scale: 1.05;
      --avatar-falloff: 0.45;
      --avatar-ease-in: cubic-bezier(0.22, 1, 0.36, 1);
      --avatar-ease-out: cubic-bezier(0.34, 3.85, 0.64, 1);
      /* Card resize */
      --resize-dur: 300ms;
      --resize-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Card hover tilt */
      --tilt-perspective: 1000px;
      --tilt-return: 1000ms;
      --tilt-return-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --tilt-follow: 400ms;
      --tilt-follow-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --tilt-glare-opacity: 0.32;
      --tilt-glare-fade: 300ms;
      --tilt-glare-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Like button */
      --like-color: #f40051;
      --like-fill: 150ms;
      --like-pop: 350ms;
      --like-pop-ease: cubic-bezier(0.34, 1.96, 0.64, 1);
      --like-particle-dur: 600ms;
      --like-particle-dist: 20px;
      --like-particle-size: 2.5px;
      --like-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Plus to menu morph */
      --morph-open-dur: 350ms;
      --morph-close-dur: 250ms;
      --morph-ease: cubic-bezier(0.34, 1.25, 0.64, 1);
      --morph-close-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --morph-r-closed: 40px;
      --morph-r-open: 20px;
      --morph-fade-dur: 200ms;
      --morph-slide: 40px;
      --morph-rotate: 45deg;
      --morph-scale: 0.97;
      --morph-blur: 2px;
      /* Toggle */
      --toggle-dur: 350ms;
      --toggle-travel: 14.66px;
      --toggle-ov1: 1px;
      --toggle-ov2: 0px;
      --toggle-track: 0ms;
      --toggle-ease: cubic-bezier(0.34, 1.35, 0.64, 1);
      /* Number pop-in (02) */
      --digit-dur: 500ms;
      --digit-distance: 8px;
      --digit-stagger: 70ms;
      --digit-blur: 2px;
      --digit-ease: cubic-bezier(0.34, 1.45, 0.64, 1);
      --digit-dir-x: 0;
      --digit-dir-y: 1;
      /* Shimmer text */
      --shimmer-dur: 2000ms;
      --shimmer-base: #7c7c7c;
      --shimmer-highlight: #0d0d0d;
      --shimmer-band: 400%;
      --shimmer-ease: linear;
      /* Checkbox check */
      --check-box: 150ms;
      --check-draw: 350ms;
      --check-delay: 0ms;
      --check-uncheck: 150ms;
      --check-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Tabs sliding */
      --tabs-dur: 250ms;
      --tabs-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --tabs-text-muted: rgba(15, 15, 15, 0.8);
      --tabs-text-active: #0f0f0f;
      --tabs-bar-bg: #f1f1f1;
      --tabs-pill-bg: #ffffff;
      /* Learn more hover */
      --learn-shift: 2px;
      --learn-spread: 8deg;
      --learn-in: 350ms;
      --learn-out: 350ms;
      --learn-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Accordion expand */
      --acc-expand: 250ms;
      --acc-collapse: 250ms;
      --acc-chevron: 250ms;
      --acc-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Menu dropdown */
      --dropdown-open-dur: 250ms;
      --dropdown-close-dur: 150ms;
      --dropdown-pre-scale: 0.97;
      --dropdown-closing-scale: 0.99;
      --dropdown-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Skeleton loader and reveal */
      --pulse-dur: 1000ms;
      --pulse-count: 1;
      --pulse-min: 0.5;
      --reveal-dur: 400ms;
      --reveal-blur: 2px;
      --reveal-ease: ease-in-out;
      /* Tooltip open/close (17) */
      --tt-in-dur: 150ms;
      --tt-out-dur: 50ms;
      --tt-scale: 0.98;
      --tt-delay: 80ms;
      --tt-in-ease: ease-out;
      --tt-out-ease: ease-out;
      --tt-bg: #ffffff;
      --tt-fg: #2f2f2f;
    }

    * { box-sizing: border-box; }
    *, *::before, *::after { margin: 0; padding: 0; }

    html {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
      -webkit-tap-highlight-color: transparent;
    }
    html, body { min-height: 100dvh; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-sans);
      font-size: 14px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
    }

    button {
      font: inherit;
      color: inherit;
      appearance: none;
      border: 0;
      background: transparent;
      cursor: pointer;
    }

    /* ══ Stage — Figma frame 2420:20473, 686×515, slots at exact
       design coordinates (the design's gaps embody the 20px rule) ══ */
    .stage-scale { transform-origin: center center; }
    .stage {
      position: relative;
      width: 800px;
      height: 540px;
    }
    .slot { position: absolute; }

    /* Shared white "material" surface (index --material tokens) */
    .surface {
      background: var(--material-bg);
      box-shadow: var(--material-shadow);
      border-radius: 12px;
    }

    /* ── 1 · Avatar group hover (11) — slot (270,37) 157×47 ────── */
    #avatars {
      left: 270px; top: 51px; width: 157px; height: 47px;
      display: flex; align-items: center;
    }
    .t-avatar-group { position: relative; display: flex; }
    /* Avatar hover tooltip — the exact component the demo app uses
       (example.html .avatar-tooltip): a single shared pill that stays
       mounted and animates its x-position + width to retarget as you
       move across avatars, showing each person's name. */
    .avatar-tooltip {
      position: absolute;
      left: 0; bottom: calc(100% + 8px);
      transform: translateX(0);
      height: 32px;
      display: inline-flex; align-items: center; justify-content: center;
      padding: 0; border-radius: 40px;
      font-size: 12px; font-weight: 400; line-height: 16px;
      white-space: nowrap;
      pointer-events: none;
      z-index: 80;
      opacity: 0; visibility: hidden;
      width: 0; overflow: hidden;
      background: #ffffff; color: #17181c;
      box-shadow:
        0 2px 8px 0 rgba(0, 0, 0, 0.04),
        0 0 0 1px rgba(0, 0, 0, 0.06),
        0 1px 1px 0 rgba(0, 0, 0, 0.04);
      transition:
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
        width 160ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 120ms cubic-bezier(0.22, 1, 0.36, 1) 50ms,
        visibility 0s linear 170ms;
    }
    .avatar-tooltip[data-show="true"] {
      opacity: 1; visibility: visible;
      transition:
        transform 160ms cubic-bezier(0.22, 1, 0.36, 1),
        width 160ms cubic-bezier(0.22, 1, 0.36, 1),
        opacity 120ms cubic-bezier(0.22, 1, 0.36, 1),
        visibility 0s linear 0s;
    }
    .avatar-tooltip-text { display: inline-block; white-space: nowrap; padding: 0; line-height: 32px; }
    .t-avatar {
      transform-origin: center;
      /* translateY before scale so scale doesn't amplify the lift offset. */
      transform: translateY(var(--shift, 0px)) scale(var(--scale-active, 1));
      transition: transform var(--avatar-dur) var(--avatar-ease-in);
      will-change: transform;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--bg);
      overflow: hidden;
      flex-shrink: 0;
      background: var(--chip-bg);
    }
    .t-avatar + .t-avatar { margin-left: -8px; }
    .t-avatar img { width: 100%; height: 100%; display: block; object-fit: cover; }
    .t-avatar.is-more {
      display: grid; place-items: center;
      background: #e9e9e9;
      font-size: 11px; font-weight: 500; color: var(--text-muted);
    }

    /* ── 2 · Image open tilt (Pro, from index .pv28) ──────────────
       A small image that zooms open to full size with a 3D tilt/bend
       and follows the pointer while open. Ported from the index Pro
       prototype "Image open tilt" (the CSS zoom + 3D bend; the optional
       pixel-warp canvas is omitted). z-index is raised so the opened
       image sits above neighbouring components. ── */
    #resize {
      left: 446px; top: 53px;
      width: 66px; height: 48px;   /* closed footprint (220×160 · 0.3) */
      overflow: visible;
      z-index: 60;                 /* opened image sits on top */
      --img-perspective: 900px;
      --img-w: 220px;
      --img-h: 160px;
      --img-closed-scale: 0.3;
      --img-open-dur: 450ms;
      --img-open-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --img-close-dur: 350ms;
      --img-close-ease: cubic-bezier(0.34, 1.25, 0.64, 1);
      --img-depth: 70px;
      --img-rx: 0deg;
      --img-ry: 0deg;
      /* Bend (canvas warp) — index tokens read by the port. */
      --pv27: 50;                              /* bend strength */
      --pv12: 350ms;                           /* bend duration */
      --pvu: cubic-bezier(0.22, 1, 0.36, 1);   /* bend ease */
      --pvw: cubic-bezier(0.22, 1, 0.36, 1);   /* open flight ease */
      --pvl: cubic-bezier(0.34, 1.25, 0.64, 1);/* close flight ease */
      --pv13: 450ms;                           /* open flight dur */
      --pvv: 350ms;                            /* close flight dur */
      --pro-surface-shadow:
        0 0 0 1px rgba(0,0,0,0.06),
        0 2px 6px rgba(0,0,0,0.05),
        0 4px 42px rgba(0,0,0,0.06);
    }
    .pv1u { perspective: var(--img-perspective); position: absolute; inset: 0; }
    /* Bend render layer — a canvas that draws the warped image while
       .is-bending is set (the real image is hidden underneath). */
    .pv1g { position: absolute; display: none; pointer-events: none; }
    .pv28.is-bending { background: transparent; }
    .pv28.is-bending .pv2i { visibility: hidden; }
    .pv28.is-bending .pv1g { display: block; }
    .pv28 {
      appearance: none; border: 0; padding: 0;
      position: absolute;
      left: 50%; top: 50%;
      margin-left: calc(var(--img-w) / -2);
      margin-top: calc(var(--img-h) / -2);
      width: var(--img-w); height: var(--img-h);
      border-radius: 32px;
      overflow: visible;
      cursor: pointer;
      background: #eeeeef;
      box-shadow: var(--pro-surface-shadow);
      -webkit-tap-highlight-color: transparent;
      transform-origin: center;
      scale: var(--img-closed-scale);
      transform: rotateX(0deg) rotateY(0deg) translateZ(0);
      will-change: scale, transform;
      transition:
        scale var(--img-close-dur) var(--img-close-ease),
        border-radius var(--img-close-dur) var(--img-close-ease);
    }
    .pv28.is-open {
      border-radius: 16px;
      scale: 1;
      transition:
        scale var(--img-open-dur) var(--img-open-ease),
        border-radius var(--img-open-dur) var(--img-open-ease);
      animation: pv2a var(--img-open-dur) var(--img-open-ease) both;
    }
    .pv28.is-closing { animation: pv1s var(--img-close-dur) var(--img-close-ease) both; }
    .pv28 .pv2i {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; display: block; pointer-events: none;
      border-radius: inherit;
    }
    @keyframes pv2a {
      0%   { transform: rotateX(0deg) rotateY(0deg) translateZ(calc(var(--img-depth) * -1)); }
      45%  { transform: rotateX(var(--img-rx)) rotateY(var(--img-ry)) translateZ(calc(var(--img-depth) * -0.4)); }
      100% { transform: rotateX(0deg) rotateY(0deg) translateZ(0); }
    }
    @keyframes pv1s {
      0%   { transform: rotateX(0deg) rotateY(0deg) translateZ(0); }
      45%  { transform: rotateX(calc(var(--img-rx) * -0.45)) rotateY(calc(var(--img-ry) * -0.45)) translateZ(calc(var(--img-depth) * -0.4)); }
      100% { transform: rotateX(0deg) rotateY(0deg) translateZ(0); }
    }

    /* ── 3 · Card stack hover (Pro, from index .pv1r/.pv24) ───────
       Three stacked cards; on hover the outer two fan out and rotate
       with a spring, and any hovered card lifts + scales above. Ported
       faithfully from the index Pro prototype "Card stack hover". ── */
    #tilt {
      left: 297px; top: 106px;  /* centres the 120px stack in the region */
      width: 120px; height: 120px;
      z-index: 5;
      --stack-spread-dur: 410ms;
      --stack-spread-ease: cubic-bezier(0.31, 1.84, 0.64, 1);
      --stack-return-dur: 360ms;
      --stack-return-ease: cubic-bezier(0.34, 1.5, 0.64, 1);
      --stack-scale-dur: 610ms;
      --stack-scale-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --stack-dx-mult: 1.42;
      --stack-drot-mult: 1;
      --stack-hover-scale: 1.04;
      --pro-surface-shadow:
        0 0 0 1px rgba(0,0,0,0.06),
        0 2px 6px rgba(0,0,0,0.05),
        0 4px 42px rgba(0,0,0,0.06);
    }
    .pv1r { position: relative; width: 120px; height: 120px; flex-shrink: 0; }
    /* When the stack fans open (hover / touch) lift it above neighbours. */
    #tilt:hover, #tilt:has(.pv1r.is-open) { z-index: 70; }
    .pv24 {
      appearance: none; border: 0; padding: 0;
      position: absolute; top: 0; left: 0;
      width: 78px; height: 78px;
      border-radius: 12px;
      background: #fff;
      box-shadow: var(--pro-surface-shadow);
      overflow: hidden; cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      translate: var(--cx) var(--cy);
      rotate: var(--rot);
      scale: 1;
      opacity: var(--card-op, 1);
      transition:
        translate var(--stack-return-dur) var(--stack-return-ease),
        rotate var(--stack-return-dur) var(--stack-return-ease),
        scale var(--stack-scale-dur) var(--stack-scale-ease),
        opacity var(--stack-return-dur) var(--stack-return-ease);
      will-change: translate, rotate, scale, opacity;
    }
    .pv24 img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; pointer-events: none; }
    @media (hover: hover) {
      .pv1r:hover .pv24 {
        translate: calc(var(--cx) + var(--dx) * var(--stack-dx-mult)) calc(var(--cy) + var(--dy));
        rotate: calc(var(--rot) + var(--drot) * var(--stack-drot-mult));
        opacity: 1;
        transition:
          translate var(--stack-spread-dur) var(--stack-spread-ease),
          rotate var(--stack-spread-dur) var(--stack-spread-ease),
          scale var(--stack-scale-dur) var(--stack-scale-ease),
          opacity var(--stack-spread-dur) var(--stack-spread-ease);
      }
      .pv24:hover { scale: var(--stack-hover-scale); z-index: 30; }
    }
    .pv1r.is-open .pv24 {
      translate: calc(var(--cx) + var(--dx) * var(--stack-dx-mult)) calc(var(--cy) + var(--dy));
      rotate: calc(var(--rot) + var(--drot) * var(--stack-drot-mult));
      opacity: 1;
      transition:
        translate var(--stack-spread-dur) var(--stack-spread-ease),
        rotate var(--stack-spread-dur) var(--stack-spread-ease),
        scale var(--stack-scale-dur) var(--stack-scale-ease),
        opacity var(--stack-spread-dur) var(--stack-spread-ease);
    }

    /* ── 4 · Like button (23) — slot (445,125) 75×36 ───────────── */
    #like { left: 445px; top: 125px; }
    .t-like {
      position: relative;
      display: inline-flex; align-items: center; gap: 8px;
      height: 36px; padding: 0 14px 0 12px;
      border-radius: 50px;
      font-size: 13px; font-weight: 500;
      background: var(--material-bg);
      box-shadow: var(--material-shadow);
      cursor: pointer;
      transition: background-color 130ms ease;
    }
    .t-like:hover { background: color-mix(in srgb, var(--material-bg) 98%, #000); }
    .t-like-icon { display: inline-flex; }
    .t-like-heart { color: currentColor; transition: color var(--like-fill) var(--like-ease); }
    .t-like-heart path {
      fill: transparent; stroke: currentColor;
      transition: fill var(--like-fill) var(--like-ease), stroke var(--like-fill) var(--like-ease);
    }
    .t-like[data-liked="true"] .t-like-heart { color: var(--like-color); }
    .t-like[data-liked="true"] .t-like-heart path { fill: currentColor; }
    /* Pop scale lives on an HTML wrapper, never the <svg> itself. */
    .t-like[data-liked="true"] .t-like-icon { animation: t-like-pop var(--like-pop) var(--like-pop-ease); }
    @keyframes t-like-pop { 0% { transform: scale(1); } 30% { transform: scale(0.82); } 100% { transform: scale(1); } }
    /* Burst origin centred on the heart glyph: padding-left 12px +
       half of the 16px icon = 20px from the button's left edge. */
    .t-like-particles {
      position: absolute; left: 20px; top: 50%;
      width: 0; height: 0; pointer-events: none;
      color: var(--like-color);
    }
    .t-like-particles i {
      position: absolute;
      left: calc(var(--like-particle-size) * var(--psize, 1) / -2);
      top: calc(var(--like-particle-size) * var(--psize, 1) / -2);
      width: calc(var(--like-particle-size) * var(--psize, 1));
      height: calc(var(--like-particle-size) * var(--psize, 1));
      border-radius: 50%; background: currentColor; opacity: 0;
    }
    @keyframes t-like-burst {
      0%   { opacity: 0; transform: translate(0, 0) scale(0.4); }
      20%  { opacity: 1; transform: translate(calc(var(--px) * 0.25), calc(var(--py) * 0.25)) scale(1); }
      100% { opacity: 0; transform: translate(var(--px), var(--py)) scale(var(--p-end-scale, 0.6)); }
    }
    .t-like.is-bursting .t-like-particles i {
      animation: t-like-burst var(--pdur, var(--like-particle-dur)) ease-out var(--pdelay, 0ms) forwards;
    }

    /* ── 5 · Plus to menu morph (20) — slot (129,153) 78×65 ────── */
    /* The 40px circle sits centred in the slot; the panel grows
       up-and-left out of it, so the circle's corner stays pinned
       (right/bottom anchoring per the recipe). */
    #morph {
      /* 20px clear of the Pro text on the left; bottom edge rests on
         the Pro text baseline (y=207.5) so the two share a base line. */
      right: calc(800px - 208px);     /* circle right edge at x=208 */
      bottom: calc(540px - 207.5px);  /* circle bottom edge at y=207.5 */
      z-index: 30;
      --morph-close-anticip: 5px;
      --morph-close-anticip-dur: 700ms;
      --morph-close-anticip-ease: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .t-morph {
      position: relative;
      width: 40px; height: 40px;
      border-radius: var(--morph-r-closed);
      overflow: hidden;
      background: var(--material-bg);
      box-shadow: var(--material-shadow);
      transition:
        width var(--morph-close-dur) var(--morph-close-ease),
        height var(--morph-close-dur) var(--morph-close-ease),
        border-radius var(--morph-close-dur) var(--morph-close-ease);
    }
    .t-morph[data-open="true"] {
      /* Height fits the three menu rows (3 × 40px + 8px top/bottom pad). */
      width: 200px; height: 136px;
      border-radius: var(--morph-r-open);
      transition:
        width var(--morph-open-dur) var(--morph-ease),
        height var(--morph-open-dur) var(--morph-ease),
        border-radius var(--morph-open-dur) var(--morph-ease);
    }
    .t-morph-plus {
      position: absolute;
      inset: auto 0 0 auto;
      width: 40px; height: 40px;
      display: grid; place-items: center;
      transition:
        opacity var(--morph-fade-dur) var(--morph-close-ease),
        transform var(--morph-open-dur) var(--morph-close-ease),
        filter var(--morph-fade-dur) var(--morph-close-ease);
    }
    .t-morph-plus svg {
      transition: transform var(--morph-open-dur) var(--morph-close-ease);
    }
    .t-morph[data-open="true"] .t-morph-plus {
      opacity: 0;
      transform: translateX(calc(-1 * var(--morph-slide)));
      filter: blur(var(--morph-blur));
      pointer-events: none;
    }
    .t-morph[data-open="true"] .t-morph-plus svg {
      transform: scale(var(--morph-scale)) rotate(var(--morph-rotate));
    }
    /* Close anticipation (index .p20-morph.is-closing): the circle nudges
       diagonally then settles as the menu collapses into it — this is
       the "close bounce". */
    .t-morph.is-closing {
      animation: t-morph-close-anticip var(--morph-close-anticip-dur) var(--morph-close-anticip-ease);
    }
    @keyframes t-morph-close-anticip {
      0%   { transform: translate(0, 0); }
      35%  { transform: translate(var(--morph-close-anticip), var(--morph-close-anticip)); }
      100% { transform: translate(0, 0); }
    }
    .t-morph-menu {
      position: absolute;
      inset: 0;
      padding: 8px;
      display: flex; flex-direction: column; justify-content: center; gap: 2px;
      opacity: 0;
      transform: translateX(var(--morph-slide)) scale(var(--morph-scale));
      filter: blur(var(--morph-blur));
      pointer-events: none;
      transition:
        opacity var(--morph-fade-dur) var(--morph-close-ease),
        transform var(--morph-open-dur) var(--morph-close-ease),
        filter var(--morph-fade-dur) var(--morph-close-ease);
    }
    .t-morph[data-open="true"] .t-morph-menu {
      opacity: 1;
      transform: translateX(0) scale(1);
      filter: blur(0);
      pointer-events: auto;
    }
    .morph-item {
      display: flex; align-items: center; gap: 10px;

    /* ── 6 · Toggle (27) — slot (226,149) 44×22 ────────────────── */
    #toggle { left: 226px; top: 133px; }
    .t-toggle {
      display: block;
      width: 44px; height: 22px;
      border-radius: 22px;
      background: #e2e2e2;
      position: relative;
      transition: background var(--toggle-track) var(--toggle-ease),
                  background-color 200ms ease;
    }
    .t-toggle[data-on="true"] { background: #34c759; }
    .t-toggle-thumb {
      position: absolute;
      left: 3.66px; top: 3.66px;
      width: 22px; height: 14.66px;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(0, 0, 0, 0.18);
      translate: 0 0;
      will-change: translate;
    }
    .t-toggle[data-on="true"] .t-toggle-thumb { translate: var(--toggle-travel) 0; }
    .t-toggle.is-init[data-on="true"] .t-toggle-thumb { animation: t-toggle-on var(--toggle-dur) var(--toggle-ease) both; }
    .t-toggle.is-init[data-on="false"] .t-toggle-thumb { animation: t-toggle-off var(--toggle-dur) var(--toggle-ease) both; }
    @keyframes t-toggle-on {
      0% { translate: 0 0; }
      55% { translate: calc(var(--toggle-travel) + var(--toggle-ov1)) 0; }
      80% { translate: calc(var(--toggle-travel) - var(--toggle-ov2)) 0; }
      100% { translate: var(--toggle-travel) 0; }
    }
    @keyframes t-toggle-off {
      0% { translate: var(--toggle-travel) 0; }
      55% { translate: calc(0px - var(--toggle-ov1)) 0; }
      80% { translate: var(--toggle-ov2) 0; }
      100% { translate: 0 0; }
    }

    /* ── 7 · Number pop-in (02) — slot (457,187), whole number ─── */
    #counter {
      /* Left-aligned with the Like button (x=445). */
      left: 445px; top: 187px;
      font-variant-numeric: tabular-nums;
      font-size: 20px; font-weight: 600;
      letter-spacing: 0.01em;
      cursor: pointer;
    }
    @keyframes t-digit-pop-in {
      0% {
        transform: translate(
          calc(var(--digit-distance) * var(--digit-dir-x)),
          calc(var(--digit-distance) * var(--digit-dir-y))
        );
        opacity: 0;
        filter: blur(var(--digit-blur));
      }
      100% { transform: translate(0, 0); opacity: 1; filter: blur(0); }
    }
    .t-digit-group { position: relative; display: inline-flex; align-items: baseline; }
    .t-digit { display: inline-block; will-change: transform, opacity, filter; }
    /* Leading chars ("32,") never animate — plain static spans. Only
       the last three digits live inside .t-digit-tail, which is the
       positioning context for the ghost, so the pop in/out is scoped
       to the tail and the prefix holds perfectly still. */
    .t-digit-static { display: inline-block; }
    .t-digit-tail { position: relative; display: inline-flex; align-items: baseline; }
    /* Every digit pops in (per the library recipe); the last two ride
       1× / 2× --digit-stagger behind via the data-stagger delays. */
    .t-digit-group.is-animating .t-digit {
      animation: t-digit-pop-in var(--digit-dur) var(--digit-ease) both;
    }
    .t-digit-group.is-animating .t-digit[data-stagger="1"] { animation-delay: var(--digit-stagger); }
    .t-digit-group.is-animating .t-digit[data-stagger="2"] { animation-delay: calc(var(--digit-stagger) * 2); }
    /* Ghost layer (from index P9): the OLD digits are snapshotted into
       an absolutely-stacked ghost that pops out upward in parallel with
       the new digits popping in from below. These rules sit after the
       .is-animating pop-in rules on purpose — equal specificity, later
       wins — so ghost chars play the pop-out, not the pop-in. */
    .t-digit-group .t-digit-ghost {
      position: absolute;
      inset: 0;
      display: inline-flex;
      align-items: baseline;
      pointer-events: none;
    }
    .t-digit-group .t-digit-ghost .t-digit {
      animation: t-digit-pop-out var(--digit-dur) var(--digit-ease) both;
    }
    .t-digit-group .t-digit-ghost .t-digit[data-stagger="1"] { animation-delay: var(--digit-stagger); }
    .t-digit-group .t-digit-ghost .t-digit[data-stagger="2"] { animation-delay: calc(var(--digit-stagger) * 2); }
    @keyframes t-digit-pop-out {
      0%   { transform: translate(0, 0); opacity: 1; filter: blur(0); }
      100% {
        transform: translate(
          calc(var(--digit-distance) * var(--digit-dir-x) * -1),
          calc(var(--digit-distance) * var(--digit-dir-y) * -1)
        );
        opacity: 0;
        filter: blur(var(--digit-blur));
      }
    }

    /* ── 9 · Checkbox check (25) — slot (445,227), no box ─────── */
    #notify {
      /* Vertically centre-aligned with the Learn more button (center y≈256). */
      left: 445px; top: 248px;
      display: inline-flex; align-items: center; gap: 10px;
      cursor: pointer;
      user-select: none;
    }
    .t-check {
      width: 16px; height: 16px;
      flex-shrink: 0;
      border-radius: 5px;

        box-shadow var(--check-box) var(--check-ease);

      fill: none; stroke: #ffffff; stroke-width: 2;

      transition: stroke-dashoffset var(--check-uncheck) var(--check-ease);
    }

    }

    /* ── 10 · Tabs sliding (16) — slot (100,236) 176×36 ────────── */
    #tabs { left: 100px; top: 236px; }
    .t-tabs {
      position: relative;
      display: inline-flex;
      align-items: center;
      gap: 3px;

    /* ── 11 · Learn more hover (24) — slot (299,236) 117×40 ────── */
    #learn { left: 299px; top: 236px; }
    .t-learn {
      display: inline-flex; align-items: center; gap: 6px;
      height: 40px; padding: 0 10px 0 16px;

    .t-learn-chevron {

    .t-learn:hover .t-learn-chevron { transform: translateX(var(--learn-shift)); transition-duration: var(--learn-in); }
    .t-learn:hover .t-learn-arm { transition-duration: var(--learn-in); }
    .t-learn:hover .t-learn-arm-top { transform: rotate(var(--learn-spread)); }

    /* ── 12 · Accordion (21) — slot (85,295) 197×42 collapsed ──── */
    #accordion { left: 85px; top: 295px; width: 197px; z-index: 10; }
    .t-acc { border-radius: 12px; }
    .t-acc-head {
      width: 100%;
      height: 42px;
      padding: 0 14px;
      display: flex; align-items: center; justify-content: space-between;
      font-size: 13px; font-weight: 500;
      border-radius: 12px;
      transition: background-color 120ms ease;
    }
    /* Hover fill only while collapsed — once open the header is a
       state indicator, not an invitation, so the wash drops away. */
    .t-acc[data-open="false"] .t-acc-head:hover { background: rgba(0, 0, 0, 0.02); }
    .t-acc-chevron {
      display: inline-flex;
      color: var(--text-muted);
      transform: scaleY(1);
      transform-origin: center;
      transition: transform var(--acc-chevron) var(--acc-ease);
    }
    .t-acc-chevron svg { display: block; }

      fill: none; stroke: currentColor; stroke-width: 1.5;
      stroke-linecap: round; stroke-linejoin: round;
      vector-effect: non-scaling-stroke;
    }
    .t-acc[data-open="true"] .t-acc-chevron { transform: scaleY(-1); }
    .t-acc-panel {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows var(--acc-collapse) var(--acc-ease);
    }
    .t-acc[data-open="true"] .t-acc-panel {
      grid-template-rows: 1fr;
      transition: grid-template-rows var(--acc-expand) var(--acc-ease);
    }
    .t-acc-panel-inner {
      overflow: hidden;
      opacity: 0;
      filter: blur(2px);
      transition:
        opacity var(--acc-collapse) var(--acc-ease),
        filter var(--acc-collapse) var(--acc-ease);
    }
    .t-acc[data-open="true"] .t-acc-panel-inner {
      opacity: 1;
      filter: blur(0);
      transition:
        opacity var(--acc-expand) var(--acc-ease),
        filter var(--acc-expand) var(--acc-ease);

    .acc-rows { padding: 0 6px 8px; display: flex; flex-direction: column; gap: 2px; }
    .acc-row {
      display: flex; align-items: center; justify-content: space-between;
      height: 32px; padding: 0 8px;
      border-radius: 8px;

    /* ── 13 · Share dropdown (from example-dropdown.html / skill-refine)
       Combines: menu dropdown (05) + sliding tabs (16) + card resize
       (01) + page side-by-side (08) + text swap (04) + icon swap (09).
       Faithful to the canonical component; scoped under #share so it
       can't collide with the standalone tabs / dropdown recipes. ──── */
    #share {
      left: 307px; top: 295px; z-index: 20;
      /* Local component tokens (light values from example-dropdown.html) */
      --bg-modal: #ffffff;
      --bg-tab-active: rgba(94, 94, 94, 0.08);
      --bg-ghost-hover: rgba(61, 61, 61, 0.04);
      --text-strong: #1b1b1b;
      --text-body: #474747;
      --text-muted-2: #676767;
      --text-tab-idle: #717171;
      --text-on-dropdown: #17181c;
      --stroke-btn:
        inset 0 0 0 1px rgba(0, 0, 0, 0.06),
        inset 0 -1px 0 0 rgba(0, 0, 0, 0.06),
        inset 0 0 0 1px rgba(196, 196, 196, 0.1);
      --shadow-modal:
        0 0 0 1px rgba(0, 0, 0, 0.06),
        0 2px 6px 0 rgba(0, 0, 0, 0.05),
        0 4px 42px 0 rgba(0, 0, 0, 0.06);
      --shadow-btn: 0 1px 3px 0 rgba(0, 0, 0, 0.04);
      --radius-menu: 18px;
      --radius-row: 12px;
      --radius-tab: 50px;
      --radius-btn: 36px;
      /* Tab content slide (08 — page side-by-side) */
      --page-slide-dur: 250ms;
      --page-fade-dur: 250ms;
      --page-slide-distance: 8px;
      --page-blur: 3px;
      --page-stagger: 0ms;
      --page-exit-enabled: 1;
      --page-slide-ease: cubic-bezier(0.22, 1, 0.36, 1);
      --page-fade-ease: cubic-bezier(0.22, 1, 0.36, 1);
      /* Icon swap (09) */
      --icon-swap-dur: 200ms;
      --icon-swap-blur: 2px;
      --icon-swap-start-scale: 0.25;
      --icon-swap-ease: ease-in-out;
      /* Text states swap (04) */
      --text-swap-dur: 150ms;
      --text-swap-enter-delay: 0ms;
      --text-swap-translate-y: 4px;
      --text-swap-blur: 2px;
      --text-swap-ease: ease-in-out;
    }
    /* Share button (Figma 632:3925 — Secondary/Default) */
    /* Trigger button removed — the dropdown is shown open in place,
       matching the Figma collage. */
    #share .share-anchor {
      position: relative;
      overflow: visible;
      display: inline-flex;
      width: 200px;
    }

    /* Dropdown shell / menu (Figma 632:3816) */
    #share .dd-shell {
      position: static;
      z-index: 50;
      overflow: visible;
    }
    #share .dropdown {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 200px;
      box-sizing: border-box;
      padding: 8px;
      background: var(--bg-modal);
      border-radius: var(--radius-menu);
      box-shadow: var(--shadow-modal);
      overflow: visible;
    }

    /* Tab row + sliding pill (16 — tabs sliding) */
    #share .dd-tabs { position: relative; display: inline-flex; align-items: center; gap: 4px; height: 32px; }

      --check-ease-opacity: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-rotate: cubic-bezier(0.22, 1, 0.36, 1);
      --check-ease-bob: cubic-bezier(0.34, 1.35, 0.64, 1);
      --check-ease-path: cubic-bezier(0.22, 1, 0.36, 1);
    }
    .publish-card {
      position: relative;
      width: 188px; height: 155px;   /* fixed — never grows on publish */
      padding: 28px 17px;
      border-radius: 18px;
      background: var(--material-bg);
      box-shadow: var(--material-shadow);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 13px;
      text-align: center;
    }
    /* The badge is absolutely centred in the card: in the published
       (success) state it's the ONLY thing shown — the copy and button
       fade out, leaving just the checkmark centred. The card height is
       fixed so nothing grows or shifts. */
    .publish-card .badge-slot {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
    }
    .published-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      line-height: 0;
    }
    .published-badge svg { display: block; }
    .publish-copy {
      margin: 0;
      width: 153px;
      font-size: 13px;
      line-height: 16px;
      font-weight: 400;
      color: #676767;
    }
    .publish-action {
      height: 32px;
      padding: 0 14px;
      border-radius: 50px;
      background: var(--chip-bg);
      color: var(--text);
      font-size: 13px; font-weight: 500; line-height: 16px;
      transition: background-color 120ms ease, box-shadow 120ms ease;
    }
    .publish-action:hover { background: var(--chip-bg-hover); }
    .publish-action:active { background: #eae9e9; }
    /* Published — copy + button are hidden entirely; only the checkmark
       remains (fades via t-fade-blur, no reflow since the card height is
       fixed and the badge is absolutely centred). */
    /* #publish prefix is load-bearing: the `.t-fade-blur` rest rule
       below is ID-scoped, so without a matching ID here it outranks
       this state and the fade-out never runs. */
    .publish-card[data-published="true"] { cursor: pointer; }
    #publish .publish-card[data-published="true"] .publish-copy,
    #publish .publish-card[data-published="true"] .publish-action {
      opacity: 0;
      filter: blur(var(--text-swap-blur));
      pointer-events: none;
    }
    .publish-card[data-published="true"] .publish-action:hover { background: rgba(0, 0, 0, 0.04); }

    /* Plain fade + blur — no translate (example.html t-fade-blur). */
    #publish .t-fade-blur {
      opacity: 1;
      filter: blur(0);
      transition:
        filter  var(--text-swap-dur) var(--text-swap-ease),
        opacity var(--text-swap-dur) var(--text-swap-ease);
      will-change: filter, opacity;
    }
    #publish .t-fade-blur.is-fading {
      opacity: 0;
      filter: blur(var(--text-swap-blur));
      pointer-events: none;
    }
    /* Fade-blur + text-swap combined: re-declare the full triplet so
       the entry rise actually transitions (see example.html notes). */
    #publish .t-fade-blur.t-text-swap {
      transition:
        transform var(--text-swap-dur) var(--text-swap-ease),
        filter    var(--text-swap-dur) var(--text-swap-ease),
        opacity   var(--text-swap-dur) var(--text-swap-ease);
    }
    /* Entry parking pose — rises from BELOW (publish-hero flip). */
    #publish .t-fade-blur.t-text-swap.is-enter-start {
      transform: translateY(var(--text-swap-translate-y));
      filter: blur(var(--text-swap-blur));
      opacity: 0;
      transition: none;
    }

    /* Success check (10-success-check) — verbatim from the skill. */
    .t-success-check {
      display: inline-block;
      transform-origin: center;
      opacity: 0;
      will-change: transform, opacity, filter;
    }
    .t-success-check svg { display: block; overflow: visible; }
    .t-success-check svg path {
      stroke-dasharray: 20;
      stroke-dashoffset: 20;
    }
    .t-success-check[data-state="in"] {
      animation:
        t-check-fade   var(--check-opacity-dur) var(--check-ease-opacity) forwards,
        t-check-rotate var(--check-rotate-dur)  var(--check-ease-rotate)  forwards,
        t-check-blur   var(--check-blur-dur)    var(--check-ease-out)     forwards,
        t-check-bob    var(--check-bob-dur)     var(--check-ease-bob)     forwards;
    }
    .t-success-check[data-state="in"] svg path {
      animation: t-check-draw var(--check-path-dur) var(--check-ease-path) var(--check-path-delay, 0ms) forwards;
    }
    @keyframes t-check-fade { from { opacity: 0; } to { opacity: 1; } }
    @keyframes t-check-rotate {
      from { transform: rotate(var(--check-rotate-from)); }
      to   { transform: rotate(0deg); }
    }
    @keyframes t-check-blur {
      from { filter: blur(var(--check-blur-from)); }
      to   { filter: blur(0); }
    }
    @keyframes t-check-bob {
      from { translate: 0 var(--check-y-amount); }
      to   { translate: 0 0; }
    }
    @keyframes t-check-draw { to { stroke-dashoffset: 0; } }

    /* ══ Reduced motion — required guard from every recipe ══════ */
    @media (prefers-reduced-motion: reduce) {
      .t-avatar { transition: none !important; transform: none !important; }
      .t-resize { transition: none !important; }
      .t-tilt-card { transform: none !important; transition: none !important; }
      .t-like-icon, .t-like-particles i { animation: none !important; }
      .t-morph, .t-morph-plus, .t-morph-menu { transition: none !important; }
      .t-toggle-thumb { animation: none !important; }
      .t-digit-group .t-digit { animation: none !important; }
      .t-check, .t-check svg path { transition: none !important; }
      .t-tabs-pill, .t-tab { transition: none !important; }
      .t-learn-chevron, .t-learn-arm { transition: none !important; }
      .t-acc-panel, .t-acc-panel-inner, .t-acc-chevron { transition: none !important; }
      .t-dropdown { transition: none !important; }
      .t-skel-skeleton, .t-skel-content { transition: none !important; }
      .t-skel-skeleton.is-pulsing > * { animation: none !important; }
      #publish .t-fade-blur, #publish .t-text-swap { transition: none !important; }
      .t-success-check, .t-success-check svg path { animation: none !important; }
      .t-success-check[data-state="in"] { opacity: 1; }
      .t-success-check[data-state="in"] svg path { stroke-dashoffset: 0; }
    }
  </style>
</head>

  <script>
    (function () {
      "use strict";
      var docStyle = getComputedStyle(document.documentElement);
      function cssNum(name, fb) {
        var v = parseFloat(docStyle.getPropertyValue(name));
        return Number.isFinite(v) ? v : fb;
      }
      function cssEase(name, fb) {
        return docStyle.getPropertyValue(name).trim() || fb;
      }

      /* ── Responsive: scale the fixed 686×515 stage down ──────── */
      var scaleWrap = document.querySelector(".stage-scale");
      function fitStage() {
        var s = Math.min(1, (window.innerWidth - 32) / 800);
        scaleWrap.style.transform = s < 1 ? "scale(" + s + ")" : "";
      }
      fitStage();
      window.addEventListener("resize", fitStage);

      /* ── 1 · Avatar group hover (recipe 11) ──────────────────── */
      (function () {
        var root = document.querySelector(".t-avatar-group");
        var avatars = Array.prototype.slice.call(root.querySelectorAll(".t-avatar"));
        function setShifts(activeIdx, phase) {
          var lift = cssNum("--avatar-lift", -4);
          var falloff = cssNum("--avatar-falloff", 0.45);
          var scale = cssNum("--avatar-scale", 1.05);
          var tf = phase === "out"
            ? cssEase("--avatar-ease-out", "cubic-bezier(0.34, 3.85, 0.64, 1)")
            : cssEase("--avatar-ease-in", "cubic-bezier(0.22, 1, 0.36, 1)");
          avatars.forEach(function (el, i) {
            el.style.transitionTimingFunction = tf;
            if (activeIdx == null) {
              el.style.setProperty("--shift", "0px");
              el.style.setProperty("--scale-active", "1");
              return;
            }
            var d = Math.abs(i - activeIdx);
            el.style.setProperty("--shift", (lift * Math.pow(falloff, d)).toFixed(3) + "px");
            el.style.setProperty("--scale-active", i === activeIdx ? String(scale) : "1");
          });
        }
        avatars.forEach(function (el, i) {
          el.addEventListener("mouseenter", function () { setShifts(i, "in"); });
        });
        root.addEventListener("mouseleave", function () { setShifts(null, "out"); });

        /* Shared name tooltip (example.html .avatar-tooltip): one bubble
           that stays mounted and animates its x-position + width to
           retarget across avatars, showing each person's name. */
        var canHover = window.matchMedia && window.matchMedia("(hover: hover)").matches;
        if (canHover) {
          var tip = document.createElement("span");
          tip.className = "avatar-tooltip";
          tip.setAttribute("role", "tooltip");
          tip.setAttribute("aria-hidden", "true");
          tip.setAttribute("data-show", "false");
          var tipText = document.createElement("span");
          tipText.className = "avatar-tooltip-text";
          tip.appendChild(tipText);
          root.appendChild(tip);
          var hideTimer = null;
          function cancelHide() { if (hideTimer) { clearTimeout(hideTimer); hideTimer = null; } }
          function hideSoon() {
            cancelHide();
            hideTimer = setTimeout(function () {
              tip.setAttribute("data-show", "false");
              tip.setAttribute("aria-hidden", "true");
            }, 50);
          }
          function place(wrap, text) {
            cancelHide();
            tipText.textContent = text;

                for (var lx = 0; lx < latW; lx++) { var px = (lx * LAT - padDev) / dpr, li = ly*latW+lx; latDX[li] = halfDev * noise2(noiseR, px - driftX, py - driftY); latDY[li] = halfDev * noise2(noiseG, px - driftX, py - driftY); }
              }
              var rBox = blur > 0.3 ? Math.round(blur * dpr * 1.22) : 0;
              if (rBox >= 2) {
                remap(halfData.data, wW2, wH2, 2, false);
                var rHalf = Math.max(1, Math.round(rBox / 2));
                boxH(halfData.data, blurTmp, wW2, wH2, rHalf); boxH(blurTmp, halfData.data, wW2, wH2, rHalf);
                boxV(halfData.data, blurTmp, wW2, wH2, rHalf, false); boxV(blurTmp, halfData.data, wW2, wH2, rHalf, true);
                whctx.putImageData(halfData, 0, 0); ctx.clearRect(0, 0, workW, workH); ctx.drawImage(workHalf, 0, 0, wW2, wH2, 0, 0, workW, workH);
              } else { remap(workData.data, workW, workH, 1, true); ctx.putImageData(workData, 0, 0); }
            }
            frame++;
            canvas.style.transform = "translate(" + swayX.toFixed(1) + "px, " + fallY.toFixed(1) + "px) rotate(" + (spin*p).toFixed(2) + "deg) scale(" + (1 + (spread/100)*p).toFixed(3) + ")";
            canvas.style.opacity = alpha.toFixed(3);
            if (rawP < 1) { requestAnimationFrame(tick); return; }
            ctx.clearRect(0, 0, canvas.width, canvas.height); canvas.style.transform = ""; canvas.style.opacity = "";
            window.setTimeout(function () {
              card.style.visibility = "";
              card.classList.remove("is-respawning");
              card.offsetWidth;
              card.classList.add("is-respawning");
              running = false;
            }, readNum("--pv1a", 800));
          })(t0);
        }
        btn.addEventListener("click", dissolve);
        // Drop .is-respawning once the pop-in finishes (matches index):
        // leaving it on means the next respawn restarts from a dirty
        // state and the card visibly jumps.
        card.addEventListener("animationend", function (e) {
          if (e.animationName === "pv1a") card.classList.remove("is-respawning");
        });
      })();

      /* ── 15 · Organic shimmer (Pro) — paused by default, click
         toggles play/pause (the card also presses down via CSS). */
      (function () {
        var el = document.querySelector(".pv1e");
        if (!el) return;
        function toggle() {
          var playing = el.getAttribute("data-playing") === "true";
          el.setAttribute("data-playing", String(!playing));
        }
        el.addEventListener("click", toggle);
        el.addEventListener("keydown", function (e) {
          if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
        });
      })();

      /* ── 16 · Publish (from example.html / skill good example) ────
         Click Publish: the copy + button fade out (t-fade-blur, driven
         by [data-published]) and the success check plays on its own —
         the published state shows ONLY the checkmark. After a short
         hold it reverts: the checkmark fades out as the copy + button
         fade back in, so the demo loops. */
      (function () {
        var slot = document.getElementById("publish");
        var card = slot.querySelector(".publish-card");
        var badge = slot.querySelector(".published-badge");
        var btn = slot.querySelector(".publish-action");

        var publishTextDur = parseFloat(
          getComputedStyle(slot).getPropertyValue("--text-swap-dur")
        ) || 200;
        var published = false;

        function playSuccessCheck() {
          badge.style.transition = "";
          badge.style.opacity = "";
          badge.setAttribute("data-state", "out");
          void badge.offsetWidth; // reflow to replay keyframes from 0
          badge.setAttribute("data-state", "in");
        }
        function fadeBadgeOut() {
          // Freeze the badge's current opacity, then ease it to 0 so the
          // checkmark leaves smoothly as the copy + button return.
          var cs = getComputedStyle(badge);
          badge.style.opacity = cs.opacity;
          badge.setAttribute("data-state", "out"); // drop the keyframes
          void badge.offsetWidth;
          badge.style.transition = "opacity " + publishTextDur + "ms ease";
          badge.style.opacity = "0";
        }

        function publish() {
          if (published) return;
          published = true;
          card.dataset.published = "true"; // CSS fades copy + button out
          playSuccessCheck();              // checkmark pops in, centred
        }
        function revert() {
          if (!published) return;
          published = false;
          fadeBadgeOut();                   // checkmark fades out
          card.dataset.published = "false"; // CSS fades copy + button in
        }

        // Publish on the button; in the check state the button is hidden,
        // so the whole card takes the click to go back.
        btn.addEventListener("click", function (e) { e.stopPropagation(); publish(); });
        card.addEventListener("click", function () { if (published) revert(); });
      })();
    })();
  </script>
</body>
