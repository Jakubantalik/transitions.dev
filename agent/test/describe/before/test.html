<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dropdown test</title>
  <!--
    Test fixture for the Transitions Agent. The dropdown below uses a typical
    "first try" transition on purpose, so the Agent has something to flag:
      - every property transitions, with a literal, slow duration and ease-in
      - the menu animates height and top (layout) instead of opacity/transform
      - linear keyframes, no exit animation (the menu just vanishes)
      - no reduced-motion guard
  -->
  <style>
    :root {
      --transition-fast: 150ms;
      --transition-normal: 300ms;
      --transition-slow: 400ms;
    }

    @media (prefers-reduced-motion: reduce) {
      :root {
        --transition-fast: 0ms;
        --transition-normal: 0ms;
        --transition-slow: 0ms;
      }
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding-top: 120px;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .dropdown { position: relative; }

    .dropdown-button {
      height: 36px;
      padding: 0 14px;
      border: 1px solid #ddd;
      border-radius: 5px;
      background: #fff;
      font: inherit;
      font-size: 14px;
      cursor: pointer;
      transition: opacity var(--transition-normal) ease-in, transform var(--transition-normal) ease-in;
    }
    .dropdown-button:hover { background: #eee; border-color: #bbb; }

    .dropdown-menu {
      position: absolute;
      top: 44px;
      left: 0;
      width: 180px;
      margin: 0;
      padding: 6px;
      list-style: none;
      background: #fff;
      border: 1px solid #ddd;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      animation: menu-open var(--transition-slow) linear;
    }

    @keyframes menu-open {
      from { height: 0; top: 20px; }
      to { height: 132px; top: 44px; }
    }

    .dropdown-item {
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 14px;
      cursor: pointer;
      transition: opacity var(--transition-fast) ease, transform var(--transition-fast) ease;
    }
    .dropdown-item:hover { background: #f0f0f0; padding-left: 16px; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script type="text/babel">
    const { useState, useRef, useEffect } = React;

    function Dropdown() {
      const [open, setOpen] = useState(false);
      const ref = useRef(null);

      // Close on outside click.
      useEffect(() => {
        function onDown(e) {
          if (ref.current && !ref.current.contains(e.target)) setOpen(false);
        }
        document.addEventListener("mousedown", onDown);
        return () => document.removeEventListener("mousedown", onDown);
      }, []);

      return (
        <div className="dropdown" ref={ref}>
          <button className="dropdown-button" onClick={() => setOpen(!open)}>
            Options ▾
          </button>
          {open && (
            <ul className="dropdown-menu">
              <li className="dropdown-item" onClick={() => setOpen(false)}>Edit</li>
              <li className="dropdown-item" onClick={() => setOpen(false)}>Duplicate</li>
              <li className="dropdown-item" onClick={() => setOpen(false)}>Archive</li>
              <li className="dropdown-item" onClick={() => setOpen(false)}>Delete</li>
            </ul>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<Dropdown />);
  </script>
</body>
</html>
