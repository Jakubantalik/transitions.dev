# Transitions Motion Agent fix service.
#   npx wrangler secret put ANTHROPIC_API_KEY
#   node agent/worker/pack-recipes.mjs            (from the repo root; packs free + Pro)
#   npx wrangler kv bulk put recipes-kv.json --namespace-id <RECIPES id> --remote
#   npx wrangler deploy
# Re-run the pack + bulk put whenever recipes change.
name = "transitions-agent-api"
main = "worker.mjs"
compatibility_date = "2026-08-01"

kv_namespaces = [
  { binding = "LICENSES", id = "73398617348a4f6ca3891d36743948c9" },
  { binding = "USAGE", id = "152c8166c8b74f18ae7d3c61e6d75cd4" },
  { binding = "RECIPES", id = "57b69ecb5f0149d893535348b7340a82" },
]

# Route under the existing API host, next to the transitions-pro endpoints.
# Usage history (agent_events). Same D1 database as the accounts API
# (transitions-pro); migration 0008 creates the table.
d1_databases = [
  { binding = "DB", database_name = "transitions_pro", database_id = "04a8aded-c8aa-4f30-88f0-1cd8a9106dab" },
]
routes = [{ pattern = "api.transitions.dev/v1/agent/*", zone_name = "transitions.dev" }]

# Budget fuse: total free-tier fixes per month across all free users.
# At ~$0.02-0.05 per haiku polish fix, 2000 caps free-tier spend near $50-100.
[vars]
FREE_GLOBAL_MONTHLY = "2000"
