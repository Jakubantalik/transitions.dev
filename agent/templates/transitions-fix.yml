# Transitions Agent: hosted fixes from CI - Business plan, ONE secret.
# Copy to .github/workflows/transitions-fix.yml. Trigger from the Actions tab;
# it scans, gets fixes from the transitions.dev fix service (our AI, your
# quota), and opens a pull request. Nothing touches main.
#
# Secret needed:
#   TRANSITIONS_AGENT_LICENSE   your transitions.dev license key (Business
#                               includes 200 hosted fixes/month; revamp mode
#                               and the Pro recipe library are Business-only)
#
# One-time repo setting (GitHub blocks it by default): Settings > Actions >
# General > Workflow permissions > check "Allow GitHub Actions to create and
# approve pull requests". Without it the fixes still push as a branch, but
# the PR must be opened by hand.
name: Transitions Agent fix

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Fix mode"
        type: choice
        default: polish
        options:
          - polish
          - revamp

permissions:
  contents: write
  pull-requests: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix and open a PR
        env:
          TRANSITIONS_AGENT_LICENSE: ${{ secrets.TRANSITIONS_AGENT_LICENSE }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "transitions-agent"
          git config user.email "agent@transitions.dev"
          npx transitions-agent fix --mode "${{ inputs.mode }}" --yes --pr
