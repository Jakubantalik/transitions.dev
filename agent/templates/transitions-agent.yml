# Transitions Agent: motion score on every pull request.
# Copy this file to .github/workflows/transitions-agent.yml in your repository.
name: Transitions Agent

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  motion:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Jakubantalik/transitions.dev/agent@main
        with:
          # Fail the check when the motion score drops below this (0 = report only).
          min-score: "0"
          # Optional: with a license configured, the comment drops its setup hint.
          license: ${{ secrets.TRANSITIONS_AGENT_LICENSE }}
